<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Decision stream tile · JEV component</title><meta name="theme-color" content="#05030a">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Space+Grotesk:wght@500;600;700&family=Fraunces:opsz,wght@9..144,700;9..144,900&display=swap" media="print" onload="this.media='all'">
<style>/* ===== JEV base — tokens + shared primitives. Modules add their own css/<module>.css and never edit this file. ===== */
:root {
  --bg: #05030a; --bg2: #0b0711; --ink: #f4eef6; --mut: #8d8499; --dim: #837a8f; /* dim: >= 4.5:1 on --bg and on the card panels, still one step under --mut */
  --pink: #ff2e6e; --pink2: #ff7ab3; --green: #2ee6a6; --blue: #4d8dff; --amber: #ffc13d; --violet: #a66bff;
  --orange: #ff8a3d; --cyan: #3be0ff; --red: #ff4d5e; --up: #2ee6a6; --dn: #ff4d5e;
  --line: rgba(255, 255, 255, .08); --line2: rgba(255, 255, 255, .14);
  --panel: linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .016));
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
  --sans: 'Space Grotesk', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --serif: 'Fraunces', 'Playfair Display', 'Iowan Old Style', Georgia, serif;
  --gut: clamp(12px, 3vw, 32px);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --tint: 255, 46, 110; /* section colour temperature: core eases it per section (hero pink · builds magenta · hour amber · desk blue-violet · lab green) */
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; color-scheme: dark; scroll-padding-top: calc(var(--hud-h, 56px) + 10px); scrollbar-width: thin; scrollbar-color: rgba(255, 46, 110, .45) #0b0711; }
body { background: var(--bg); color: var(--ink); font: 400 12.5px/1.55 var(--mono); overflow-x: hidden; -webkit-font-smoothing: antialiased; min-height: 100vh; min-height: 100svh; }
main { display: block; }
.skip { position: fixed; left: 12px; top: -60px; z-index: 200; padding: 10px 14px; border-radius: 8px; background: var(--pink); color: #fff; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 11px; transition: top .15s; }
.skip:focus { top: 10px; outline: 2px solid #fff; outline-offset: 2px; }
.skip:focus-visible { box-shadow: 0 0 22px rgba(255, 46, 110, .7); }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
::selection { background: rgba(255, 46, 110, .88); color: #fff; text-shadow: none; }
::-webkit-scrollbar { width: 9px; height: 9px; } ::-webkit-scrollbar-track { background: #0b0711; }
::-webkit-scrollbar-thumb { background: linear-gradient(180deg, rgba(255, 46, 110, .55), rgba(166, 107, 255, .4)); border-radius: 9px; border: 2px solid #0b0711; }
::-webkit-scrollbar-thumb:hover { background: var(--pink); }
/* focus ring system: one pink ring, 2px offset, for every interactive element (modules may refine the colour, never remove it) */
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--pink2); outline-offset: 2px; }
:is(button, a, [role="button"], summary):focus-visible { box-shadow: 0 0 0 5px rgba(255, 46, 110, .22), 0 0 18px rgba(255, 46, 110, .4); }
:is(.m, .mets):focus-visible { outline-offset: 3px; }
main:focus, main:focus-visible, section:focus, [tabindex="-1"]:focus { outline: none; box-shadow: none; }
:target { scroll-margin-top: calc(var(--hud-h, 56px) + 10px); }
main > section[id], h2[id] { scroll-margin-top: calc(var(--hud-h, 56px) + 4px); }
canvas { display: block; }
.wrap { max-width: 1380px; margin: 0 auto; padding: 0 var(--gut); position: relative; }
.sec { position: relative; padding: clamp(34px, 5vw, 72px) 0 clamp(28px, 4vw, 56px); } /* was 100/100: ~210px of nothing between sections */
.hide-s { } .show-s { display: none; }
@media (max-width: 700px) { .hide-s { display: none !important; } .show-s { display: initial; } }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mut { color: var(--mut); } .dim { color: var(--dim); } .hot { color: var(--pink); } .up { color: var(--up); } .dn { color: var(--dn); }
.sans { font-family: var(--sans); } .serif { font-family: var(--serif); } .num { font-variant-numeric: tabular-nums; }

/* accent hook: <el data-c="pink|gray|green|blue|yellow|violet|orange|cyan|red"> exposes --cc / --cc-rgb */
[data-c="pink"] { --cc: #ff6fa6; --cc-rgb: 255,111,166; } [data-c="gray"] { --cc: #b8b2c2; --cc-rgb: 184,178,194; }
[data-c="green"] { --cc: #35e0a8; --cc-rgb: 53,224,168; } [data-c="blue"] { --cc: #5a8cff; --cc-rgb: 90,140,255; }
[data-c="yellow"] { --cc: #ffc53d; --cc-rgb: 255,197,61; } [data-c="violet"] { --cc: #a66bff; --cc-rgb: 166,107,255; }
[data-c="orange"] { --cc: #ff8a3d; --cc-rgb: 255,138,61; } [data-c="cyan"] { --cc: #3be0ff; --cc-rgb: 59,224,255; }
[data-c="red"] { --cc: #ff4d5e; --cc-rgb: 255,77,94; }

/* ----- section heading kit ----- */
.sec-head { margin-bottom: clamp(22px, 3.4vw, 44px); }
.eb { display: flex; align-items: center; gap: 12px; font-size: 10px; letter-spacing: .26em; text-transform: uppercase; color: var(--pink); margin-bottom: 14px; }
.eb::before { content: ''; width: 34px; height: 1px; background: linear-gradient(90deg, transparent, var(--pink)); box-shadow: 0 0 10px var(--pink); }
.eb i { font-style: normal; color: var(--mut); letter-spacing: .2em; }
.h2 { font: 700 clamp(26px, 4.6vw, 60px)/1.02 var(--sans); letter-spacing: -.02em; max-width: 22ch; text-wrap: balance; }
.h2 em { --em-sh: 0 0 28px rgba(var(--tint), .55); font-style: normal; color: var(--pink); text-shadow: var(--em-sh); }
/* split-text headings (core.js JEV.splitText): letters rise in, staggered by --i; the <em> letters then catch a travelling glint (--j) */
.h2.st-ready .st-w { display: inline-block; white-space: nowrap; }
.h2.st-ready .st-c { display: inline-block; opacity: 0; transform: translate3d(0, .62em, 0) rotate(4deg); transform-origin: 0 100%; }
html[data-tier="3"] .h2.st-ready .st-c { filter: blur(7px); }
html[data-tier="3"] .h2.st-in .st-c { filter: none; }
.h2.st-in .st-c { opacity: 1; transform: none; filter: none; transition: opacity .6s var(--ease), transform .85s var(--ease), filter .7s var(--ease); transition-delay: calc(var(--i, 0) * 15ms + 90ms); }
.h2.st-in em .st-c { animation: stGlint 7.5s linear 2; animation-delay: calc(var(--j, 0) * 75ms + 1.2s); }
html[data-tier="3"] .h2.st-in em .st-c { animation-iteration-count: infinite; }
@keyframes stGlint { 6% { color: #fff; text-shadow: 0 0 18px #fff, 0 0 38px rgba(var(--tint), .95); } 15%, 100% { color: var(--pink); text-shadow: var(--em-sh); } }
html[data-tier="1"] .h2.st-ready .st-c { opacity: 1; transform: none; filter: none; transition: none; animation: none; }
/* eyebrow hairline draws itself as the head lands */
.sec-head.rv .eb::before { transform: scaleX(0); transform-origin: 100% 50%; transition: transform .9s var(--ease) .25s; }
.sec-head.rv.in .eb::before { transform: none; }
/* cross-light: a fixed, static colour-temperature wash under the content (above the fx plasma at z -2); only its colour eases between sections */
body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(62% 46% at 6% -4%, rgba(var(--tint), .11), transparent 72%), radial-gradient(54% 42% at 104% 102%, rgba(var(--tint), .08), transparent 72%); }
.lede { color: var(--mut); max-width: 66ch; margin-top: 14px; font-size: 12.5px; }
/* wide screens: headline left, lede (+ optional live slot) right, bottom-aligned - instead of a 22ch headline with the right 40% empty.
   :where() keeps this at zero specificity so module heads (.bld-head, .code-head, anything with its own grid) override freely */
@media (min-width: 1100px) {
  :where(.sec-head:not(.bld-head, .code-head)) { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 34%); column-gap: clamp(36px, 5vw, 80px); align-items: end; }
  :where(.sec-head:not(.bld-head, .code-head)) > :where(.eb) { grid-column: 1 / -1; }
  :where(.sec-head:not(.bld-head, .code-head)) > :where(.h2) { grid-column: 1; grid-row: 2; }
  :where(.sec-head:not(.bld-head, .code-head)) > :where(.lede, .sec-aside) { grid-column: 2; grid-row: 2; align-self: end; margin: 0 0 .5em; padding-left: clamp(16px, 2vw, 26px);
    border-left: 1px solid transparent; border-image: linear-gradient(180deg, rgba(255, 46, 110, .75), rgba(255, 46, 110, 0)) 1; }
}
.sec-aside { margin-top: 14px; }
.sec-aside > .lede { margin: 0; padding: 0; border: 0; }
.sec-live { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 14px; font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.sec-live span { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line2); background: rgba(255, 255, 255, .03); color: var(--mut); }
.sec-live i { width: 6px; height: 6px; border-radius: 50%; background: var(--cc, var(--pink)); box-shadow: 0 0 8px var(--cc, var(--pink)); }
.sec-live small { font-size: inherit; margin-right: 4px; }
@media (max-width: 699px) { .sec-live small { flex: 1 0 100%; margin: 0; } }
.sec-live b { min-width: 2ch; color: var(--ink); font-weight: 700; letter-spacing: .04em; font-variant-numeric: tabular-nums; }

/* ----- cards with a pointer-lit border (fx sets --mx/--my on pointermove) ----- */
.card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); overflow: hidden; }
.card::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; opacity: 0; transition: opacity .35s;
  background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 0%), rgba(255, 70, 130, .95), rgba(255, 70, 130, 0) 60%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.card::after { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .35s; background: radial-gradient(320px circle at var(--mx, 50%) var(--my, 0%), rgba(255, 60, 120, .07), transparent 70%); }
.card:hover::before, .card:hover::after { opacity: 1; }
.ph { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 14px 0; font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--mut); }
.ph b { color: var(--ink); font-weight: 700; } .ph .pk { color: var(--pink); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 99px; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; border: 1px solid var(--line2); color: var(--mut); background: rgba(255, 255, 255, .03); }
.lamp { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green), 0 0 18px var(--green); animation: lampPulse 1.6s ease-in-out infinite; vertical-align: middle; }
.lamp.pink { background: var(--pink); box-shadow: 0 0 8px var(--pink), 0 0 18px var(--pink); } .lamp.amber { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
@keyframes lampPulse { 50% { opacity: .35; transform: scale(.8); } }
/* core.js toggles .is-off on sections / cards / stages that are > 200px outside the viewport: their CSS animations pause (every running animation costs a style invalidation per frame) */
.is-off, .is-off *, .is-off *::before, .is-off *::after { animation-play-state: paused !important; }

/* ----- toggle switch: <div class="sw on" data-c="orange"><i class="tg"></i></div> ----- */
.tg { display: inline-block; width: 46px; height: 24px; border-radius: 99px; position: relative; background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .14); transition: background .45s var(--ease), border-color .45s, box-shadow .45s; flex: none; }
.tg::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #7a7285; transition: left .45s var(--ease), background .45s, box-shadow .45s; }
.on > .tg, .tg.on { background: rgba(var(--cc-rgb, 255, 46, 110), .22); border-color: var(--cc, var(--pink)); box-shadow: 0 0 16px rgba(var(--cc-rgb, 255, 46, 110), .5); }
.on > .tg::after, .tg.on::after { left: 25px; background: var(--cc, var(--pink)); box-shadow: 0 0 10px var(--cc, var(--pink)); }

/* ----- mascot orb (Jev family): <span class="orb pink" style="--s:90px"><i class="e l"></i><i class="e r"></i></span> ----- */
.orb { --s: 90px; --c1: #8fbcff; --c2: #2a5cff; --g: rgba(80, 140, 255, .6); position: relative; display: inline-block; width: var(--s); height: var(--s); border-radius: 50%; flex: none;
  background: radial-gradient(circle at 32% 24%, rgba(255, 255, 255, .95) 0 5%, var(--c1) 24%, var(--c2) 68%, rgba(0, 0, 0, .55) 108%);
  box-shadow: 0 0 calc(var(--s) * .55) var(--g), inset -6px -10px 18px rgba(0, 0, 0, .38), inset 4px 6px 12px rgba(255, 255, 255, .22); }
.orb .e { position: absolute; top: 37%; width: 14%; height: 29%; border-radius: 99px; background: #0a0710; translate: var(--ex, 0) var(--ey, 0); animation: orbBlink 5.5s infinite; }
.orb .e.l { left: 30%; rotate: -13deg; } .orb .e.r { right: 30%; rotate: 13deg; animation-delay: .06s; }
@keyframes orbBlink { 0%, 93%, 100% { scale: 1 1; } 96% { scale: 1 .08; } }
.orb.pink { --c1: #ff9cc4; --c2: #ff1f75; --g: rgba(255, 46, 120, .65); } .orb.blue { --c1: #8fbcff; --c2: #2a5cff; }
.orb.white { --c1: #ffffff; --c2: #d9d2e6; --g: rgba(255, 255, 255, .45); } .orb.amber { --c1: #ffe08a; --c2: #ff9f1a; --g: rgba(255, 180, 40, .6); }
.orb.green { --c1: #8ff5cf; --c2: #12b57e; --g: rgba(46, 230, 166, .55); } .orb.violet { --c1: #cdaaff; --c2: #7a3df0; --g: rgba(166, 107, 255, .6); }
.orb.red { --c1: #ffa08f; --c2: #f0401f; --g: rgba(255, 90, 50, .6); } .orb.orange { --c1: #ffc08f; --c2: #ff6a0f; --g: rgba(255, 138, 61, .6); }
.orb.cyan { --c1: #a6f1ff; --c2: #18a8d8; --g: rgba(59, 224, 255, .55); }

/* ----- glitch wordmark: <span class="glitch" data-text="JEV">JEV</span> ----- */
.glitch { position: relative; display: inline-block; }
.glitch::before, .glitch::after { content: attr(data-text); position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen; }
.glitch::before { color: #00f0ff; animation: gl1 7s infinite steps(1); } .glitch::after { color: #ff2e6e; animation: gl2 7s infinite steps(1); }
@keyframes gl1 { 0%, 92%, 100% { opacity: 0; transform: none; } 93% { opacity: .9; transform: translate(-4px, 1px); clip-path: inset(8% 0 62% 0); } 95% { opacity: .9; transform: translate(3px, -2px); clip-path: inset(56% 0 10% 0); } 97% { opacity: .9; transform: translate(-2px, 0); clip-path: inset(30% 0 40% 0); } }
@keyframes gl2 { 0%, 92%, 100% { opacity: 0; transform: none; } 94% { opacity: .9; transform: translate(4px, -1px); clip-path: inset(52% 0 14% 0); } 96% { opacity: .9; transform: translate(-3px, 2px); clip-path: inset(12% 0 58% 0); } 98% { opacity: .9; transform: translate(2px, 0); clip-path: inset(40% 0 30% 0); } }

/* ----- scroll reveal (fx adds .in when visible) ----- */
.rv { opacity: 0; transform: translateY(26px) scale(.985); filter: blur(7px); transition: opacity .9s var(--ease), transform .9s var(--ease), filter .9s var(--ease); transition-delay: calc(var(--i, 0) * 70ms); }
.rv.in, .no-js .rv { opacity: 1; transform: none; filter: none; }

/* ----- HUD ----- */
.hud { position: sticky; top: 0; z-index: 60; display: flex; align-items: center; gap: clamp(8px, 2vw, 26px); padding: 8px max(var(--gut), env(safe-area-inset-right)) 8px max(var(--gut), env(safe-area-inset-left)); background: linear-gradient(180deg, rgba(5, 3, 10, .94), rgba(5, 3, 10, .62)); backdrop-filter: blur(14px) saturate(1.5); -webkit-backdrop-filter: blur(14px) saturate(1.5); border-bottom: 1px solid rgba(var(--tint), .22); }
.hud-scan { position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; overflow: hidden; pointer-events: none; opacity: .85; }
.hud-scan::after { content: ''; position: absolute; left: 0; top: 0; width: 28%; height: 100%; background: linear-gradient(90deg, transparent, var(--pink), #fff, var(--pink), transparent); animation: hudScan 5.5s linear infinite; } /* compositor-only (was a background-position loop) */
@keyframes hudScan { from { transform: translateX(-103%); } to { transform: translateX(360%); } }
.logo { display: flex; align-items: center; gap: 9px; flex: none; }
.logo b { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; font: 800 19px/1 var(--sans); color: #fff; background: linear-gradient(145deg, #ff4f8d, #e0155a); box-shadow: 0 0 22px rgba(255, 46, 110, .6), inset 0 1px 0 rgba(255, 255, 255, .4); }
.logo span { font: 700 15px/1 var(--sans); letter-spacing: .12em; }
.mets { display: flex; gap: clamp(12px, 2.2vw, 32px); flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; align-items: center; }
.mets::-webkit-scrollbar { display: none; }
.m { flex: none; } .m label { display: block; font-size: 9px; letter-spacing: .2em; color: var(--dim); text-transform: uppercase; }
.m { border-radius: 6px; cursor: default; }
.m b { display: block; font-size: 14px; font-weight: 700; letter-spacing: .02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
/* odometer: each digit is a 0-9 reel; the transform eases with a tiny overshoot, like a mechanical counter */
.od { display: inline-flex; vertical-align: top; } .od-s { display: inline-block; height: 1.55em; }
.od-d { display: inline-block; height: 1.55em; overflow: hidden; }
.od-r { display: block; transform: translateY(calc(var(--d, 0) * -1.55em)); transition: transform .62s cubic-bezier(.2, .9, .25, 1.12); will-change: transform; }
.od-r i { display: block; height: 1.55em; line-height: 1.55em; font-style: normal; }
.hud-prog { display: none;  position: absolute; left: 0; right: 0; top: 0; height: 2px; transform: scaleX(0); transform-origin: 0 50%; pointer-events: none; background: linear-gradient(90deg, var(--violet), var(--pink), var(--pink2)); box-shadow: 0 0 10px rgba(255, 46, 110, .7); will-change: transform; }
body.killed .hud-prog { background: var(--red); }
.hud-tip { position: fixed; z-index: 90; max-width: min(270px, calc(100vw - 16px)); padding: 9px 12px; border-radius: 10px; font-size: 10.5px; line-height: 1.5; letter-spacing: .02em; color: var(--ink); pointer-events: none;
  background: rgba(12, 7, 20, .96); border: 1px solid rgba(255, 46, 110, .4); box-shadow: 0 12px 36px rgba(0, 0, 0, .6), 0 0 22px rgba(255, 46, 110, .16); opacity: 0; transform: translateY(-4px); visibility: hidden; transition: opacity .16s, transform .2s var(--ease), visibility 0s .2s; }
.hud-tip.on { opacity: 1; transform: none; visibility: visible; transition-delay: 0s; }
.hud-help { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 12px/1 var(--mono); color: var(--mut); border: 1px solid var(--line2); background: rgba(255, 255, 255, .03); transition: color .25s, border-color .25s, background .25s; }
.hud-help:hover { color: #fff; border-color: rgba(255, 46, 110, .6); background: rgba(255, 46, 110, .16); }
@media (pointer: coarse) { .hud-help { width: 40px; height: 40px; } }
.nav { display: flex; gap: 2px; flex: none; }
.nav a { padding: 6px 10px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--mut); border-radius: 7px; transition: color .25s, background .25s; }
.nav a:hover { color: #fff; background: rgba(255, 46, 110, .16); } .nav a:active { transform: scale(.96); }
.nav a i { font-style: normal; }
@media (max-width: 1239px) { .nav a { padding: 6px 8px; } .nav a i { display: none; } } /* compact: drop the 01-05 numerals before dropping the nav */
@media (max-width: 999px) { .nav { display: none; } } /* below this the metrics would start to clip */
@media (pointer: coarse) { .nav a { display: inline-flex; align-items: center; min-height: 40px; } .kill { min-height: 40px; } .logo { min-height: 40px; min-width: 40px; } .m label { font-size: 10px; } }
@media (max-width: 400px) { .hide-xs { display: none; } } /* keep Cost inside the metric strip on 360px phones */
.kill { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 99px; font-size: 10px; font-weight: 700; letter-spacing: .16em; border: 1px solid rgba(46, 230, 166, .45); color: var(--green); background: rgba(46, 230, 166, .07); transition: .3s; }
.kill i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); animation: lampPulse 1.6s infinite; }
.kill:hover { background: rgba(46, 230, 166, .16); } .kill:active { transform: scale(.95); } .kill:focus-visible { outline-color: var(--green); box-shadow: 0 0 18px rgba(46, 230, 166, .45); } body.killed .kill:focus-visible { outline-color: var(--red); box-shadow: 0 0 18px rgba(255, 77, 94, .5); }
body.killed .kill { border-color: var(--red); color: var(--red); background: rgba(255, 77, 94, .12); } body.killed .kill i { background: var(--red); box-shadow: 0 0 12px var(--red); animation-duration: .5s; }
body.killed .hud { border-bottom-color: rgba(255, 77, 94, .6); }
body.killed::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 80; box-shadow: inset 0 0 170px rgba(255, 60, 80, .5); animation: killPulse 1.4s ease-in-out infinite; }
@keyframes killPulse { 0%, 100% { opacity: .64; } 50% { opacity: 1; } } /* static shadow, opacity pulse: compositor-only instead of re-rasterising a 1440x900 blur every frame */

/* ----- desk grid: fragments are <div class="card span-4"> etc. ----- */

@media (min-width: 960px) { .dk-grid > .span-4 { grid-column: span 4; } .dk-grid > .span-5 { grid-column: span 5; } .dk-grid > .span-6 { grid-column: span 6; } .dk-grid > .span-7 { grid-column: span 7; } .dk-grid > .span-8 { grid-column: span 8; } }

/* ----- footer ----- */
.foot { position: relative; padding: 0 0 40px; overflow: hidden; border-top: 1px solid var(--line); }
.marq { display: flex; overflow: hidden; border-bottom: 1px solid var(--line); background: rgba(255, 46, 110, .05); }
.marq > div { display: flex; flex: none; gap: 42px; padding: 11px 21px; white-space: nowrap; font-size: 10px; letter-spacing: .22em; color: var(--mut); text-transform: uppercase; animation: marq 40s linear infinite; }

@keyframes marq { to { transform: translateX(-100%); } }

.foot p b { color: var(--ink); font-weight: 500; }
.foot-row { max-width: 900px; margin: 26px auto 0; padding: 18px max(var(--gut), env(safe-area-inset-right)) 0 max(var(--gut), env(safe-area-inset-left)); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px 22px; border-top: 1px solid var(--line); }

.foot-acts { display: inline-flex; gap: 8px; }
.foot-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 99px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--mut); border: 1px solid var(--line2); background: rgba(255, 255, 255, .03); transition: color .25s, border-color .25s, background .25s, transform .25s var(--ease); }
.foot-btn:hover { color: #fff; border-color: rgba(255, 46, 110, .6); background: rgba(255, 46, 110, .14); transform: translateY(-2px); } .foot-btn:active { transform: scale(.96); }
.foot-btn kbd, .kb kbd { font: 700 10px/1 var(--mono); }
.foot-btn kbd { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 5px; border: 1px solid var(--line2); color: var(--pink2); }

/* ----- shortcuts dialog (core.js builds it on first open) ----- */
.kb-back { position: fixed; inset: 0; z-index: 140; background: rgba(3, 1, 8, .72); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); opacity: 0; visibility: hidden; transition: opacity .25s, visibility 0s .25s; }
.kb-back.on { opacity: 1; visibility: visible; transition-delay: 0s; }
.kb { position: fixed; z-index: 150; left: 50%; top: 50%; width: min(440px, calc(100vw - 24px)); max-height: calc(100svh - 24px); overflow: auto; padding: 20px 22px 18px; border-radius: 16px; transform: translate(-50%, -46%) scale(.97); opacity: 0; visibility: hidden;
  background: linear-gradient(180deg, rgba(24, 14, 34, .97), rgba(10, 6, 16, .98)); border: 1px solid rgba(255, 46, 110, .38); box-shadow: 0 30px 90px rgba(0, 0, 0, .7), 0 0 60px rgba(255, 46, 110, .16), inset 0 1px 0 rgba(255, 255, 255, .08); transition: opacity .22s, transform .3s var(--ease), visibility 0s .3s; }
.kb.on { opacity: 1; visibility: visible; transform: translate(-50%, -50%); transition-delay: 0s; }
.kb-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.kb-eb { display: block; font-size: 9px; letter-spacing: .26em; text-transform: uppercase; color: var(--pink); margin-bottom: 4px; }
.kb h2 { font: 700 22px/1.1 var(--sans); letter-spacing: -.01em; }
.kb-x { min-width: 40px; min-height: 40px; padding: 0 12px; border-radius: 10px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--mut); border: 1px solid var(--line2); background: rgba(255, 255, 255, .03); }
.kb-x:hover { color: #fff; border-color: rgba(255, 46, 110, .6); }
.kb-l { display: grid; grid-template-columns: auto 1fr; gap: 9px 16px; align-items: center; }
.kb-l dt { justify-self: start; } .kb-l dd { color: var(--mut); font-size: 11.5px; }
.kb kbd { display: inline-block; min-width: 28px; padding: 5px 8px; text-align: center; border-radius: 7px; color: var(--ink); background: rgba(255, 255, 255, .06); border: 1px solid var(--line2); border-bottom-width: 2px; box-shadow: 0 0 12px rgba(255, 46, 110, .12); }
.kb-n { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 10px; line-height: 1.7; letter-spacing: .03em; color: var(--dim); }
body.kb-open { overflow: hidden; }

/* ----- print: a plain light page; atmosphere, canvases and chrome are dropped ----- */
@media print {
  html, body { background: #fff !important; color: #111 !important; overflow: visible !important; }
  body *, body *::before, body *::after { color: #111 !important; text-shadow: none !important; box-shadow: none !important; animation: none !important; filter: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
  canvas, [id^="fx-"], .fx-ov, .hud, .skip, .marq, .kb, .kb-back, .hud-tip, body::before, body::after, .foot-acts, .orb { display: none !important; }
  .rv, .h2 .st-c { opacity: 1 !important; transform: none !important; }
  .card { background: none !important; border: 1px solid #bbb !important; break-inside: avoid; }
  .sec { padding: 16px 0 !important; break-inside: auto; } .h2 { break-after: avoid; } .eb::before { display: none; }
  .foot { border-top: 1px solid #999; } .foot p { max-width: none; }
  a[href^="#"]::after { content: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
  .rv { opacity: 1; transform: none; filter: none; }
  .h2.st-ready .st-c { opacity: 1 !important; transform: none !important; filter: none !important; animation: none !important; }
}

/* tier 1 (low): drop the expensive compositing the page used to spend on glass blur and reveal blur */
html[data-tier="1"] .card { backdrop-filter: none; -webkit-backdrop-filter: none; }
html[data-tier="1"] .rv { filter: none; }
html[data-tier="1"] .glitch::before, html[data-tier="1"] .glitch::after { mix-blend-mode: normal; }

/* ===== fx — page atmosphere, kill theatre, toasts, boot (prefix fx-) ===== */

/* ---------- 1. background: css gradient layer (fallback + pre-first-frame look) under the webgl plasma canvas ---------- */
#fx-bgf, #fx-bg { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#fx-bgf { z-index: -3;
  background:
    radial-gradient(120% 95% at 50% 45%, transparent 48%, rgba(3, 1, 8, .5) 80%, rgba(2, 1, 5, .88) 100%),
    radial-gradient(58% 46% at 14% 8%, rgba(96, 26, 140, .27), transparent 72%),
    radial-gradient(46% 40% at 88% 26%, rgba(150, 22, 80, .18), transparent 72%),
    radial-gradient(70% 55% at 50% 112%, rgba(44, 38, 150, .24), transparent 74%),
    #05030a; }
body.killed #fx-bgf { background:
    radial-gradient(120% 95% at 50% 45%, transparent 44%, rgba(64, 0, 8, .5) 78%, rgba(30, 0, 4, .9) 100%),
    radial-gradient(58% 46% at 14% 8%, rgba(140, 22, 30, .28), transparent 72%),
    radial-gradient(46% 40% at 88% 26%, rgba(170, 80, 14, .18), transparent 72%),
    radial-gradient(70% 55% at 50% 112%, rgba(110, 20, 24, .24), transparent 74%),
    #05030a; }
#fx-bg { z-index: -2; opacity: 0; transition: opacity 1s ease; }
html.fx-gl #fx-bg { opacity: 1; }

/* ---------- 1b. no-widening safety net ----------
 * a transformed box that pokes out of the viewport (a sweeping glow, a ::after hopping on a transform, a fixed overlay) leaves a
 * stale wider scrollable overflow in chromium (scrollWidth up to ~1.7x the viewport for seconds; on touch the layout viewport widens and
 * the page pans / zooms out). `clip` (not `hidden`) on both html and body keeps the body from becoming a scroll container,
 * which would break `position: sticky` on the hud. browsers without overflow: clip keep base.css' body{overflow-x:hidden}. */
@supports (overflow: clip) { html, body { overflow-x: clip; } }

/* ---------- 2. overlays (all pointer-events:none, all below the hud z-index 60) ---------- */
.fx-ov { position: fixed; inset: 0; pointer-events: none; }

.fx-scan { z-index: 55; overflow: hidden; opacity: .5; background: repeating-linear-gradient(180deg, rgba(0, 0, 0, .24) 0 1px, transparent 1px 3px); }
.fx-scan i { position: absolute; left: 0; right: 0; top: 0; height: 26vh; transform: translateY(-30vh); will-change: transform; animation: fxRoll 11s linear infinite;
  background: linear-gradient(180deg, transparent, rgba(255, 60, 120, .035) 45%, rgba(255, 110, 170, .06) 78%, transparent); }
body.killed .fx-scan i { background: linear-gradient(180deg, transparent, rgba(255, 60, 50, .045) 45%, rgba(255, 110, 70, .075) 78%, transparent); }
@keyframes fxRoll { to { transform: translateY(130vh); } }
@media (hover: none), (pointer: coarse) { .fx-scan { opacity: .26; } }

/* film grain: sparse light specks from an inline svg turbulence tile, hopped around in steps (transform only).
 * the oversized, animated tile lives inside a viewport-sized clipping host: a fixed box that pokes out of the viewport
 * (it was inset:-120px + translate up to 64px) widens the document's scrollWidth, up to ~1.2x the viewport */
.fx-grainhost { z-index: 56; overflow: hidden; contain: paint; }
.fx-grain { position: absolute; inset: -120px; opacity: .05; will-change: transform; animation: fxGrain .8s steps(1) infinite; background-size: 256px 256px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n' x='0' y='0' width='100%25' height='100%25'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='7' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .96  0 0 0 0 .86  0 0 0 0 1  0 0 0 5 -3.15'/></filter><rect width='256' height='256' filter='url(%23n)'/></svg>"); }
@keyframes fxGrain {
  0% { transform: translate(0, 0); } 12% { transform: translate(-37px, 23px); } 25% { transform: translate(29px, -51px); } 37% { transform: translate(-61px, -17px); }
  50% { transform: translate(47px, 38px); } 62% { transform: translate(-19px, 64px); } 75% { transform: translate(58px, -33px); } 87% { transform: translate(-44px, -58px); } 100% { transform: translate(0, 0); } }

/* ---------- 3. cursor spotlight (fine pointers only) ---------- */
.fx-spotwrap { display: none; z-index: 54; overflow: hidden; }
@media (hover: hover) and (pointer: fine) { .fx-spotwrap { display: block; } }
#fx-spot { position: absolute; left: 0; top: 0; width: 640px; height: 640px; margin: -320px 0 0 -320px; border-radius: 50%; opacity: 0; transition: opacity .5s; will-change: transform;
  background: radial-gradient(circle closest-side, rgba(255, 70, 140, .09), rgba(255, 46, 110, .035) 46%, transparent 100%); }
.fx-spotwrap.on #fx-spot { opacity: 1; }
body.killed #fx-spot { background: radial-gradient(circle closest-side, rgba(255, 80, 70, .1), rgba(255, 60, 50, .04) 46%, transparent 100%); }

/* ---------- 4. reveal cleanup: once a .rv has landed, drop its stagger delay so later hover transitions are instant ---------- */
.rv.fx-done { transition-delay: 0s; }
#fx-tick { position: fixed; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; }

/* ---------- 7. hud nav: section in view ---------- */
.nav { position: relative; }
.nav a.on { color: #fff; background: rgba(255, 46, 110, .11); text-shadow: 0 0 14px rgba(255, 46, 110, .7); }
.fx-navbar { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0; border-radius: 2px; pointer-events: none; opacity: 0;
  background: linear-gradient(90deg, var(--pink), var(--pink2)); box-shadow: 0 0 10px var(--pink), 0 0 24px rgba(255, 46, 110, .75);
  transition: left .5s var(--ease), width .5s var(--ease), opacity .3s; }
.fx-navbar.on { opacity: 1; }

/* ---------- 8. kill theatre: shockwave, glitch, toasts ---------- */
#fx-shock { position: fixed; inset: 0; z-index: 85; pointer-events: none; overflow: hidden; }
.fx-ring { --rc: 255, 77, 94; position: absolute; width: 520px; height: 520px; translate: -50% -50%; border-radius: 50%; will-change: scale, opacity;
  background: radial-gradient(circle closest-side, transparent 0, rgba(var(--rc), .05) 58%, rgba(var(--rc), 0) 80%, rgba(var(--rc), .32) 92.5%, rgba(var(--rc), .95) 97%, rgba(var(--rc), 0) 100%);
  animation: fxRing .95s cubic-bezier(.16, .7, .22, 1) both; }
.fx-ring.g { --rc: 46, 230, 166; }
.fx-ring.b { animation-duration: 1.3s; animation-delay: .1s; filter: saturate(.8); }
@keyframes fxRing { 0% { scale: .02; opacity: 1; } 65% { opacity: .8; } 100% { scale: var(--s, 6); opacity: 0; } }

#fx-glitch { position: fixed; inset: 0; z-index: 86; pointer-events: none; display: none; overflow: hidden; }
html.fx-glitch #fx-glitch { display: block; }
#fx-glitch::before { content: ''; position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 50%, rgba(255, 40, 70, 0), rgba(255, 40, 70, .3) 100%); animation: fxFlash .35s ease-out both; }
#fx-glitch i { position: absolute; left: -6%; right: -6%; opacity: 0; mix-blend-mode: screen; animation: fxSlice .35s steps(1) both;
  background: linear-gradient(90deg, transparent, rgba(255, 0, 70, .42) 16%, rgba(0, 235, 255, .36) 64%, transparent);
  -webkit-backdrop-filter: hue-rotate(150deg) saturate(2.4) brightness(1.35); backdrop-filter: hue-rotate(150deg) saturate(2.4) brightness(1.35); }
#fx-glitch i:nth-child(1) { top: 8%; height: 4.5%; --gx: 26; animation-delay: 0s; }
#fx-glitch i:nth-child(2) { top: 23%; height: 2.2%; --gx: -38; animation-delay: .03s; }
#fx-glitch i:nth-child(3) { top: 41%; height: 7%; --gx: 18; animation-delay: .06s; }
#fx-glitch i:nth-child(4) { top: 57%; height: 3%; --gx: -30; animation-delay: .02s; }
#fx-glitch i:nth-child(5) { top: 72%; height: 5.5%; --gx: 42; animation-delay: .05s; }
#fx-glitch i:nth-child(6) { top: 88%; height: 2.4%; --gx: -22; animation-delay: .08s; }
@keyframes fxFlash { 0% { opacity: 1; } 100% { opacity: 0; } }
@keyframes fxSlice {
  0% { opacity: 1; transform: translateX(calc(var(--gx) * 1px)); } 16% { opacity: 0; } 30% { opacity: 1; transform: translateX(calc(var(--gx) * -1.4px)); }
  48% { opacity: 0; } 62% { opacity: 1; transform: translateX(calc(var(--gx) * .6px)); } 80% { opacity: 0; } 100% { opacity: 0; } }
/* rgb split on every piece of text + a few px of jitter on the sections, ~350 ms, css only */
html.fx-glitch { animation: fxSplit .35s steps(1) both; }
@keyframes fxSplit {
  0% { text-shadow: 4px 0 rgba(255, 20, 70, .9), -4px 0 rgba(0, 235, 255, .9); } 20% { text-shadow: -6px 0 rgba(255, 20, 70, .9), 5px 0 rgba(0, 235, 255, .9); }
  40% { text-shadow: 2px 0 rgba(255, 20, 70, .8), -2px 0 rgba(0, 235, 255, .8); } 60% { text-shadow: -3px 1px rgba(255, 20, 70, .8), 3px -1px rgba(0, 235, 255, .8); }
  80% { text-shadow: 1px 0 rgba(255, 20, 70, .6), -1px 0 rgba(0, 235, 255, .6); } 100% { text-shadow: none; } }
html.fx-glitch .sec, html.fx-glitch .foot { animation: fxJit .35s steps(1) both; }
@keyframes fxJit { 0% { translate: -5px 0; } 14% { translate: 6px 1px; } 28% { translate: -3px -1px; } 42% { translate: 4px 0; } 57% { translate: -2px 1px; } 71% { translate: 2px 0; } 85% { translate: -1px 0; } 100% { translate: 0 0; } }

#fx-toasts { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); translate: -50% 0; z-index: 92; width: min(92vw, 640px);
  display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.fx-toast { --tc: 255, 122, 179; position: relative; display: flex; align-items: center; gap: 11px; max-width: 100%; padding: 11px 18px; border-radius: 16px; overflow: hidden;
  font: 700 11px/1.4 var(--mono); letter-spacing: .07em; color: var(--ink); background: rgba(14, 8, 22, .84);
  -webkit-backdrop-filter: blur(14px) saturate(1.5); backdrop-filter: blur(14px) saturate(1.5); border: 1px solid rgba(var(--tc), .5);
  box-shadow: 0 12px 40px -8px rgba(0, 0, 0, .85), 0 0 30px -6px rgba(var(--tc), .55), inset 0 1px 0 rgba(255, 255, 255, .09);
  animation: fxToastIn .5s var(--ease) both; }
.fx-t-kill { --tc: 255, 77, 94; animation: fxToastIn .5s var(--ease) both, fxToastShake .4s steps(1) .05s; }
.fx-t-ok { --tc: 46, 230, 166; }
.fx-toast { pointer-events: auto; touch-action: pan-y; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
.fx-t-ic { flex: none; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; color: rgb(var(--tc)); background: rgba(var(--tc), .13); box-shadow: 0 0 14px rgba(var(--tc), .55); }
.fx-t-ic svg { display: block; filter: drop-shadow(0 0 4px rgba(var(--tc), .9)); }
.fx-t-kill .fx-t-ic { animation: lampPulse .7s ease-in-out infinite; }
.fx-t-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: linear-gradient(90deg, rgba(var(--tc), .4), rgb(var(--tc))); box-shadow: 0 0 8px rgb(var(--tc)); transform-origin: left; animation: fxToastBar 3s linear both; }
.fx-toast.hold .fx-t-bar { animation-play-state: paused; }
.fx-toast.hold { box-shadow: 0 12px 40px -8px rgba(0, 0, 0, .85), 0 0 36px -4px rgba(var(--tc), .7), inset 0 1px 0 rgba(255, 255, 255, .12); }
.fx-t-out { animation: fxToastOut .36s ease-in both; } .fx-t-out.fast { animation-duration: .15s; }
@keyframes fxToastIn { from { opacity: 0; translate: 0 18px; scale: .94; filter: blur(6px); } to { opacity: 1; translate: 0 0; scale: 1; filter: none; } }
@keyframes fxToastOut { to { opacity: 0; translate: 0 -10px; scale: .96; filter: blur(5px); } }
@keyframes fxToastBar { to { transform: scaleX(0); } }
@keyframes fxToastShake { 0% { translate: -6px 0; } 25% { translate: 5px 0; } 50% { translate: -3px 0; } 75% { translate: 2px 0; } 100% { translate: 0 0; } }
@media (max-width: 700px) { .fx-toast { min-height: 44px; padding: 10px 14px; font-size: 10.5px; letter-spacing: .05em; } }

/* ---------- 8b. intro: camera push (zoom-blur streaks) + chromatic split settling, once, when the boot overlay lifts (tier >= 2) ---------- */
#fx-push { position: fixed; inset: 0; z-index: 84; pointer-events: none; opacity: 0; overflow: hidden; }
#fx-push::before { content: ''; position: absolute; inset: 0; will-change: transform, opacity;
  background: repeating-conic-gradient(from 3deg at 50% 50%, rgba(255, 170, 215, 0) 0 4deg, rgba(255, 170, 215, .16) 4.6deg 5deg, rgba(255, 170, 215, 0) 5.6deg 9deg, rgba(120, 200, 255, .12) 9.6deg 9.9deg, rgba(120, 200, 255, 0) 10.4deg 17deg);
  -webkit-mask-image: radial-gradient(closest-side, transparent 28%, #000 92%); mask-image: radial-gradient(closest-side, transparent 28%, #000 92%); }
html.fx-intro #fx-push { opacity: 1; }
html.fx-intro #fx-push::before { animation: fxPush 1.1s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes fxPush { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(1.7); opacity: 0; } }
html.fx-intro { animation: fxSplitIn 1s steps(1) both; }
@keyframes fxSplitIn {
  0% { text-shadow: 5px 0 rgba(255, 20, 70, .55), -5px 0 rgba(0, 235, 255, .55); } 20% { text-shadow: 3.5px 0 rgba(255, 20, 70, .45), -3.5px 0 rgba(0, 235, 255, .45); }
  40% { text-shadow: 2.4px 0 rgba(255, 20, 70, .35), -2.4px 0 rgba(0, 235, 255, .35); } 60% { text-shadow: 1.4px 0 rgba(255, 20, 70, .25), -1.4px 0 rgba(0, 235, 255, .25); }
  80% { text-shadow: .7px 0 rgba(255, 20, 70, .15), -.7px 0 rgba(0, 235, 255, .15); } 100% { text-shadow: none; } }

/* ---------- 5. boot overlay ---------- */
#fx-boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; color: var(--ink); font: 500 12px/1.7 var(--mono);
  animation: fxBootFail .01s linear 2.2s forwards; }
@keyframes fxBootFail { to { visibility: hidden; pointer-events: none; } }
/* two full-height layers, each clipped to one half, slide apart on the way out; identical backgrounds keep the seam invisible */
.fx-bh { position: absolute; inset: 0; will-change: transform; background-color: #05030a;
  background-image: radial-gradient(52% 56% at 50% 50%, rgba(255, 46, 110, .17), transparent 72%), radial-gradient(40% 40% at 12% 100%, rgba(110, 50, 220, .16), transparent 70%),
    linear-gradient(rgba(255, 255, 255, .034) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .034) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 44px 44px, 44px 44px; background-position: 0 0, 0 0, 50% 50%, 50% 50%; }
.fx-bh.t { clip-path: inset(0 0 50% 0); } .fx-bh.b { clip-path: inset(50% 0 0 0); }
.fx-bx { position: relative; z-index: 2; width: min(540px, calc(100vw - 32px)); padding: 16px 18px 14px; border-radius: 14px; border: 1px solid rgba(255, 46, 110, .38);
  background: linear-gradient(180deg, rgba(20, 10, 26, .82), rgba(9, 5, 14, .86)); box-shadow: 0 0 60px -10px rgba(255, 46, 110, .5), 0 30px 80px -20px rgba(0, 0, 0, .9), inset 0 1px 0 rgba(255, 255, 255, .08); }

@keyframes fxCaret { 50% { opacity: 0; } }

@keyframes fxOk { 0% { opacity: 0; scale: 1.5; filter: brightness(2.2); } 100% { opacity: 1; scale: 1; filter: none; } }

/* ---------- 9. custom cursor (fine pointers) ---------- */
#fx-cur { position: fixed; left: 0; top: 0; width: 0; height: 0; z-index: 95; pointer-events: none; display: none; opacity: 0; transition: opacity .25s; }
@media (hover: hover) and (pointer: fine) { #fx-cur { display: block; } }

.fx-cr, .fx-cd { position: absolute; left: 0; top: 0; mix-blend-mode: difference; will-change: transform; transform: translate3d(-200px, -200px, 0); }

/* ===== builds — "ten builds, one decision layer": particle hub + live tiles (prefix bld-) ===== */

@property --hs { syntax: '<number>'; inherits: true; initial-value: 1; }
.bld { position: relative; overflow-x: clip; --spring: cubic-bezier(.34, 1.5, .5, 1); --spring-s: cubic-bezier(.3, 1.3, .5, 1); --bld-side: clamp(186px, 20.5vw, 272px); --bld-vg: clamp(62px, 8.4vw, 100px); --bld-k: #aaa1b8; --bld-line: rgba(255, 255, 255, .06);
  background: radial-gradient(64% 34% at 50% 30%, rgba(255, 46, 110, .075), transparent 72%), radial-gradient(40% 20% at 50% 78%, rgba(255, 197, 61, .035), transparent 70%); }

/* ---------- live tiles ---------- */

.bld-tn span { display: inline-flex; align-items: center; gap: 6px; } .bld-tn .bld-tn-r { margin-left: auto; }
.bld-tn i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }
.bld-k1, .bld-b1 { background: var(--pink); box-shadow: 0 0 8px var(--pink); } .bld-k2 { background: var(--amber); box-shadow: 0 0 8px var(--amber); } .bld-k3 { background: var(--green); box-shadow: 0 0 8px var(--green); }

/* value-on-hover bubble + row hover */
.bld-vt { position: absolute; left: 0; top: 0; z-index: 5; max-width: min(340px, 92%); padding: 5px 10px; border-radius: 7px; pointer-events: none; font-size: 10px; letter-spacing: .03em; color: var(--ink); white-space: nowrap; opacity: 0; scale: .94;
  background: rgba(14, 8, 20, .96); border: 1px solid var(--line2); box-shadow: 0 6px 20px rgba(0, 0, 0, .55), 0 0 14px rgba(255, 46, 110, .18); transition: opacity .14s, scale .18s var(--ease); font-variant-numeric: tabular-nums; }

[data-vt]:hover .tr i { filter: brightness(1.3); }
.bld-or[data-vt]:hover, .bld-rr[data-vt]:hover, .bld-mr[data-vt]:hover { cursor: default; }

/* (1) decision stream */

.bld-ds { list-style: none; }
.bld-dr { display: grid; grid-template-columns: 56px minmax(0, 1fr) 38px 76px; align-items: center; gap: 8px; height: var(--bld-rh); padding: 0 6px; font-size: 10.5px; border-bottom: 1px solid var(--bld-line); white-space: nowrap; }
.bld-dr:first-child { background: linear-gradient(90deg, rgba(255, 46, 110, .17), rgba(255, 46, 110, 0) 85%); border-radius: 5px; border-bottom-color: transparent; }

.bld-foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 20px; margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--bld-line); font-size: 9.5px; letter-spacing: .1em; color: var(--bld-k); }

/* ---------- responsive ---------- */
@media (max-width: 979px) { .bld-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .bld-stats { width: 100%; } .bld-stats > div { flex: 1 1 0; } }

  .bld-halo { width: 440px; height: 400px; margin: -200px 0 0 -220px; }
  .bld-flash { width: 360px; height: 280px; margin: -140px 0 0 -180px; }
  .bld-sweep { width: 520px; margin: -260px 0 0 -260px; } .bld-ring-a { width: 330px; margin: -165px 0 0 -165px; } .bld-ring-b { display: none; }
  .bld-rw { padding: 4px 8px; font-size: 10px; gap: 6px; } .bld-hd { padding: 4px 8px; font-size: 10px; gap: 6px; } .bld-hd i { font-size: 8px; letter-spacing: .08em; }
  .bld-prims { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; }
  .bld-prims .bld-hd i { display: none; } .bld-prims .bld-hd b { font-size: 9.5px; }

  .bld-decs > :nth-child(-n+3) { grid-column: span 2; } .bld-decs > :nth-child(n+4) { grid-column: span 3; }
  .bld-decs > :nth-child(-n+3) .bld-hd i { display: none; }

  .bld-rc:nth-child(3) { border-left: 0; } .bld-rc:nth-child(n+3) { border-top: 1px solid var(--bld-line); }
  .bld-gap { font-size: 8.5px; letter-spacing: .14em; }
  .bld-fig { display: none; }
  .bld-stage { padding-bottom: 6px; }
  .bld-tiles { grid-template-columns: minmax(0, 1fr); }

}
@media (max-width: 380px) { .bld-hd i { display: none; } .bld-prims .bld-rw { flex-direction: column; align-items: flex-start; gap: 0; } .bld-prims .bld-rw b { text-align: left; } }
@media (prefers-reduced-motion: reduce) { .bld-od-r, .bld-tip, .bld-vt { transition: none; } .bld-b.bld-tilt { transform: none; } .bld-pre .bld-card, .bld-pre .bld-core, .bld-pre .bld-cv, .bld-pre .bld-gap { opacity: 1; } .bld-pre .bld-ci { transform: none; } .bld-sweep, .bld-ring { animation: none; } }

/* harness (NOT part of the section): a standalone page with a single tile uses one grid column at every width */

/* JEV motion — premium preset package. Opt-in per element via data-m / data-m-loop, or per component via component.json "motion".
   Needs nothing but motion.js (adds html.m-js, so with JS off everything stays visible). Respects prefers-reduced-motion and JEV.tier. */
:root {
  --m-ease-out: cubic-bezier(.16, 1, .3, 1);          /* expo-out: arrivals */
  --m-ease-in: cubic-bezier(.7, 0, .84, 0);           /* expo-in: exits */
  --m-ease-io: cubic-bezier(.65, 0, .35, 1);          /* in-out: moves, loops */
  --m-ease-back: cubic-bezier(.34, 1.56, .64, 1);     /* overshoot: pops */
  --m-ease-spring: linear(0, .17 4%, .52 9%, .86 14%, 1.06 19%, 1.12 23%, 1.1 27%, 1.03 33%, .98 40%, .99 47%, 1 60%, 1); /* spring, ~0.6 damping */
  --m-dur-xs: 140ms; --m-dur-sm: 260ms; --m-dur-md: 520ms; --m-dur-lg: 900ms; --m-dur-xl: 1500ms;
  --m-dur: var(--m-dur-lg);
  --m-delay: 0ms; --m-stagger: 70ms; --m-i: 0; --m-dist: 28px; --m-speed: 1;
  --m-glow: var(--cc, #ff2e6e);

  transform calc(var(--m-dur) / var(--m-speed)) var(--m-ease, var(--m-ease-out)) calc((var(--m-delay) + var(--m-i) * var(--m-stagger)) / var(--m-speed)),
  filter calc(var(--m-dur) / var(--m-speed)) var(--m-ease, var(--m-ease-out)) calc((var(--m-delay) + var(--m-i) * var(--m-stagger)) / var(--m-speed)),
  clip-path calc(var(--m-dur) / var(--m-speed)) var(--m-ease, var(--m-ease-out)) calc((var(--m-delay) + var(--m-i) * var(--m-stagger)) / var(--m-speed)); }
html.m-js [data-m="fade"]:not(.m-in):not(.m-done) { }
html.m-js [data-m="rise"]:not(.m-in):not(.m-done) { transform: translateY(var(--m-dist)); }
html.m-js [data-m="drop"]:not(.m-in):not(.m-done) { transform: translateY(calc(var(--m-dist) * -1)); }

html.m-js [data-m="flip"]:not(.m-in):not(.m-done) { transform: perspective(900px) rotateX(-62deg) translateY(14px); transform-origin: 50% 0; }

<script>
/* JEV trading decision engine — pure JS, no DOM. Loaded before core.js.
 * A small hand-tuned scoring head: numeric market/risk state in, typed answers out.

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

   *        drawdown_pct, latency_ms, signal_age_s    opt: {floor, killed}                                      */
  function decide(s, opt) {
    opt = opt || {};

    const pos = s.position_pct, dd = s.drawdown_pct, pnl = s.daily_pnl, lat = s.latency_ms, age = s.signal_age_s;
    const stale = clamp((age - 20) / 50, 0, 1);
    const room = clamp((RULES.maxPos - Math.abs(pos)) / RULES.maxPos, 0, 1);
    const cost = spr * 0.6 + 2; // fees + slippage, bps

    { w: 1.3, name: 'wide', regime: 'thin book', f: () => ({ edge_bps: pick([-1, 1]) * rnd(18, 32), imbalance: pick([-1, 1]) * rnd(0.3, 0.6), spread_bps: rnd(9, 18), vol: rnd(50, 110), position_pct: 0, drawdown_pct: rnd(0, 3), daily_pnl: rnd(-300, 500), latency_ms: rnd(40, 200), signal_age_s: rnd(2, 20) }) },
    { w: 1, name: 'stale', regime: 'stale feed', f: () => ({ edge_bps: pick([-1, 1]) * rnd(10, 28), imbalance: rnd(-0.3, 0.3), spread_bps: rnd(1, 4), vol: rnd(30, 70), position_pct: 0, drawdown_pct: rnd(0, 3), daily_pnl: rnd(-200, 500), latency_ms: rnd(200, 520), signal_age_s: rnd(55, 110) }) },
    { w: 1.5, name: 'exit', regime: 'reversal', f: () => { const sgn = pick([-1, 1]); return { edge_bps: -sgn * rnd(14, 30), imbalance: -sgn * rnd(0.2, 0.55), spread_bps: rnd(0.6, 3), vol: rnd(35, 85), position_pct: sgn * rnd(1.5, 3.5), drawdown_pct: rnd(1, 4), daily_pnl: rnd(-500, 700), latency_ms: rnd(10, 90), signal_age_s: rnd(1, 14) }; } },

    const tw = ARCH.reduce((a, b) => a + b.w, 0);

<script>
/* fx — page-wide atmosphere + micro-interaction layer.

  const toastHost = $('#fx-toasts'), toasts = [];
  const ICON = {
    info: '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.2"/><path d="M8 7.2v3.6M8 5.1v.1"/></svg>',
    ok: '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.2"/><path d="M5.2 8.2l2 2 3.6-4.1"/></svg>',
    kill: '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.2 1.8h5.6l3.4 3.4v5.6l-3.4 3.4H5.2L1.8 10.8V5.2z"/><path d="M8 4.8v3.8M8 11v.1"/></svg>',
  };
