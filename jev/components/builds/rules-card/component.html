<div class="bld-scope bld-solo">
  <article class="bld-card bld-rules" id="bld-rules" data-c="yellow">
    <div class="bld-ci">
      <div class="bld-hd"><b>thresholds + hard rules</b><i>code</i></div>
      <div class="bld-rl">
        <div class="bld-rc" data-r="floor"><span>floor</span><b id="bld-r-floor">0.85</b></div>
        <div class="bld-rc" data-r="cap"><span>loss cap</span><b id="bld-r-cap">$2,000</b></div>
        <div class="bld-rc" data-r="pos"><span>max position</span><b id="bld-r-pos">4%</b></div>
        <div class="bld-rc" data-r="kill"><span>kill switch</span><b id="bld-r-kill" class="up">armed</b></div>
      </div>
      <div class="bld-rw"><span>plumbing</span><b>your call</b></div>
    </div>
  </article>
  <button class="bld-kbtn" id="bld-kbtn" type="button">toggle kill switch <kbd>k</kbd></button>
</div>
