<div class="bld-scope bld-solo">
  <div class="bld-core" id="bld-core" role="img" aria-label="Glow behind the core, breathes with confidence (simulated)">
    <i class="bld-halo" aria-hidden="true"></i>
    <i class="bld-sweep" aria-hidden="true"></i>
    <i class="bld-ring bld-ring-a" aria-hidden="true"></i>
    <i class="bld-ring bld-ring-b" aria-hidden="true"></i>
    <i class="bld-flash" id="bld-flash" aria-hidden="true"></i>
    <div class="bld-hc"><b id="bld-hc-v">0.93</b><span>confidence</span></div>
  </div>
  <p class="bld-hc-n">set <code>--hi</code> (halo opacity, 0.8-1.3) and <code>--hs</code> (scale, 0.88-1.08) on <code>.bld-core</code></p>
</div>
