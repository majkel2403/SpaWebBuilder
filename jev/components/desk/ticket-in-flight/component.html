<div class="card dkw-world" id="dkw-world">
  <div class="ph dkw-ph">
    <span class="dkw-stg">stage <b id="dkw-stn">01</b>/06 · <b id="dkw-stv">scan</b> · loop #<b id="dkw-loop">14</b></span>
  </div>
  <div class="dkw-body">
    <aside class="dkw-tix" id="dkw-tix" aria-label="ticket in flight">
      <div class="dkw-ch"><span>ticket in flight</span><i id="dkw-tid">#0000</i></div>
      <div class="dkw-tk" id="dkw-tk">
        <i class="dkw-bd" aria-hidden="true"></i><i class="dkw-holo" aria-hidden="true"></i>
        <i class="dkw-port" id="dkw-port" aria-hidden="true"></i>
        <div class="dkw-tk1"><span class="dkw-side" id="dkw-side" data-s="buy">buy</span><b class="dkw-sym" id="dkw-sym">btc-perp</b><em class="dkw-dest" id="dkw-dest">execute</em></div>
        <div class="dkw-tk2"><span class="dkw-not"><sup>$</sup><b id="dkw-not">5,278</b></span><u id="dkw-edge">+22.4bp edge</u></div>
        <div class="dkw-kv">
          <div><label>size</label><b id="dkw-sz">1%</b></div>
          <div><label>price</label><b id="dkw-px">84,722.4</b></div>
          <div><label>conf</label><b id="dkw-cf">0.91</b></div>
        </div>
        <div class="dkw-rail" id="dkw-rail" style="--q:0;--mc:#2ee6a6" aria-hidden="true">
          <i class="dkw-rln"></i><i class="dkw-rfl"></i><i class="dkw-tl"></i>
          <i class="dkw-sd" style="--n:0;--ac:#2ee6a6"></i><i class="dkw-sd" style="--n:1;--ac:#ffc13d"></i><i class="dkw-sd" style="--n:2;--ac:#ff2e6e"></i>
          <i class="dkw-sd" style="--n:3;--ac:#a66bff"></i><i class="dkw-sd" style="--n:4;--ac:#4d8dff"></i><i class="dkw-sd" style="--n:5;--ac:#ff8a3d"></i>
          <b class="dkw-mk"></b>
        </div>
        <div class="dkw-rl" aria-hidden="true"><span>spot</span><span>prior</span><span>edge</span><span>kelly</span><span>taker</span><span>closer</span></div>
        <div class="dkw-now"><span class="orb green" id="dkw-now-o"><i class="e l"></i><i class="e r"></i></span><span class="dkw-nt"><b id="dkw-now-n">spotter</b><i id="dkw-now-v">scan</i></span><em id="dkw-now-x">8 books</em></div>
        <div class="dkw-cd"><span>closes in <b id="dkw-cd" class="num">1:44</b></span><i class="dkw-cdb"><i id="dkw-cdf"></i></i></div>
        <div class="dkw-halt" aria-hidden="true"><b>halted</b><i>kill switch · orders held for review</i></div>
      </div>
      <div class="dkw-ag" id="dkw-ag">
        <button type="button" class="dkw-ar" data-k="spotter" style="--ac:#2ee6a6;--ac-rgb:46,230,166" aria-pressed="false"><span class="orb green"><i class="e l"></i><i class="e r"></i></span><span class="dkw-an"><b>spotter</b><i>scans books and venues</i></span><span class="dkw-av num">SFO</span><span class="dkw-ab"><i></i></span></button>
        <button type="button" class="dkw-ar" data-k="prior" style="--ac:#ffc13d;--ac-rgb:255,193,61" aria-pressed="false"><span class="orb amber"><i class="e l"></i><i class="e r"></i></span><span class="dkw-an"><b>prior</b><i>prior from history</i></span><span class="dkw-av num">.62</span><span class="dkw-ab"><i></i></span></button>
        <button type="button" class="dkw-ar" data-k="edge" style="--ac:#ff2e6e;--ac-rgb:255,46,110" aria-pressed="false"><span class="orb pink"><i class="e l"></i><i class="e r"></i></span><span class="dkw-an"><b>edge</b><i>fair value vs market</i></span><span class="dkw-av num">+2.8</span><span class="dkw-ab"><i></i></span></button>
        <button type="button" class="dkw-ar" data-k="kelly" style="--ac:#a66bff;--ac-rgb:166,107,255" aria-pressed="false"><span class="orb violet"><i class="e l"></i><i class="e r"></i></span><span class="dkw-an"><b>kelly</b><i>sizes the ticket</i></span><span class="dkw-av num">1%</span><span class="dkw-ab"><i></i></span></button>
        <button type="button" class="dkw-ar" data-k="taker" style="--ac:#4d8dff;--ac-rgb:77,141,255" aria-pressed="false"><span class="orb blue"><i class="e l"></i><i class="e r"></i></span><span class="dkw-an"><b>taker</b><i>crosses the spread</i></span><span class="dkw-av num">0.4bp</span><span class="dkw-ab"><i></i></span></button>
        <button type="button" class="dkw-ar" data-k="closer" style="--ac:#ff8a3d;--ac-rgb:255,138,61" aria-pressed="false"><span class="orb orange"><i class="e l"></i><i class="e r"></i></span><span class="dkw-an"><b>closer</b><i>takes profit / stops</i></span><span class="dkw-av num">+$37</span><span class="dkw-ab"><i></i></span></button>
      </div>
    </aside>
  </div>
</div>
