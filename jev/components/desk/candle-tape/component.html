<div class="card span-8 dkt-tape rv" id="dkt-tape" style="--i:2">
  <div class="ph"><span><b class="pk">◆</b> <b>the tape</b> <i class="dkt-ph-s hide-s">— btc 1m · vwap ±1σ bands · volume · live order book</i></span><span class="dkt-sig hide-s">hi <b id="dkt-hi" class="num">—</b> · lo <b id="dkt-lo" class="num">—</b> · vol <b id="dkt-vol" class="num">—</b></span></div>
  <div class="dkt-th">
    <div class="dkt-px"><span class="dkt-pxv"><sup>$</sup><b id="dkt-px">84,722</b><em id="dkt-px-d">.4</em></span><span class="dkt-pxp" id="dkt-pxp"><i>▲</i><b id="dkt-pxc">+0.00%</b></span></div>
    <div class="dkt-chips" role="group" aria-label="chart layers">
      <span class="dkt-chip dkt-st" data-c="pink">btc-perp</span>
      <span class="dkt-chip dkt-st" data-c="gray">1m</span>
      <button type="button" class="dkt-chip on" data-c="yellow" data-l="vwap" aria-pressed="true">vwap</button>
      <button type="button" class="dkt-chip on" data-c="violet" data-l="bands" aria-pressed="true">bands</button>
      <button type="button" class="dkt-chip on" data-c="green" data-l="book" aria-pressed="true">live book</button>
    </div>
  </div>
  <div class="dkt-tc" id="dkt-tc"><canvas id="dkt-cv" aria-label="simulated btc-perp candles with vwap bands, volume and a live order book"></canvas><i class="dkt-sweep" aria-hidden="true"></i></div>
  <div class="dkt-lg"><span><i class="dkt-g up">▲</i> buy fired</span><span><i class="dkt-g dn">▼</i> sell fired</span><span><i class="dkt-g am">◆</i> close / flatten</span><span><i class="dkt-g vi">▬</i> vwap ±1σ</span><span class="dkt-lgx">1 candle = 1 sim-minute · 6 s live · feed is simulated</span></div>
</div>
