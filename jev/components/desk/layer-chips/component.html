<div class="card dkc dklc" id="dklc">
  <div class="ph"><span><b class="pk">◆</b> <b>chip kit</b> <i class="dkt-ph-s hide-s">— status chips · toggle chips · palette</i></span></div>
  <div class="dklc-b">
    <label class="dklc-l">status chips (.dkt-chip.dkt-st)</label>
    <div class="dkt-chips">
      <span class="dkt-chip dkt-st" data-c="pink">btc-perp</span>
      <span class="dkt-chip dkt-st" data-c="gray">1m</span>
      <span class="dkt-chip dkt-st" data-c="green" id="dklc-live">last .91 · execute</span>
    </div>
    <label class="dklc-l">toggle chips (button.dkt-chip, .on = active, aria-pressed)</label>
    <div class="dkt-chips" role="group" aria-label="chart layers" id="dklc-grp">
      <button type="button" class="dkt-chip on" data-c="yellow" data-l="vwap" aria-pressed="true">vwap</button>
      <button type="button" class="dkt-chip on" data-c="violet" data-l="bands" aria-pressed="true">bands</button>
      <button type="button" class="dkt-chip on" data-c="green" data-l="book" aria-pressed="true">live book</button>
      <button type="button" class="dkt-chip" data-c="cyan" data-l="volume" aria-pressed="false">volume</button>
    </div>
    <label class="dklc-l">accent palette (data-c)</label>
    <div class="dkt-chips">
      <span class="dkt-chip dkt-st" data-c="pink">pink</span><span class="dkt-chip dkt-st" data-c="green">green</span><span class="dkt-chip dkt-st" data-c="blue">blue</span><span class="dkt-chip dkt-st" data-c="yellow">yellow</span><span class="dkt-chip dkt-st" data-c="violet">violet</span><span class="dkt-chip dkt-st" data-c="orange">orange</span><span class="dkt-chip dkt-st" data-c="cyan">cyan</span><span class="dkt-chip dkt-st" data-c="red">red</span>
    </div>
    <p class="dklc-r">layers on: <b id="dklc-out">vwap · bands · live book</b></p>
  </div>
</div>
