<div class="card dkb-card dkb-drift dkpp" id="dkpp" role="region" aria-label="probability of profit across simulated random walks">
  <div class="ph">
    <span class="dkb-t"><b class="pk">◆</b> <b>drift vs noise</b> <i class="dkb-ph-s">— the caption</i></span>
    <span class="dkb-hn"><span class="dkb-halt">halted</span><b id="dkpp-n" class="num">140</b> paths</span>
  </div>
  <div class="dkb-bh dkpp-bh">
    <div class="dkb-big dkb-cap">
      <label>P(profit) · n=<span id="dkpp-tr">44</span></label>
      <div class="dkb-bv"><span id="dkpp-pp" class="num">91.4</span><small>%</small></div>
    </div>
    <div class="dkb-kv">
      <div><label>drift / step</label><b id="dkpp-mu" class="num dkb-vi">+0.80bp</b></div>
      <div><label>noise σ / step</label><b id="dkpp-sg" class="num dkb-or">8.6bp</b></div>
    </div>
  </div>
  <div class="dkb-df">
    <span class="dkb-gr" aria-hidden="true"><i>loss</i><u></u><i>profit</i></span>
    <span class="dkb-pool">pooled <b id="dkpp-pool" class="num">91.6%</b> over <b id="dkpp-runs" class="num">1 run</b></span>
  </div>
</div>
