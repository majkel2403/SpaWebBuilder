<div class="card dkb-card dkb-drift" id="dkb-drift" style="--i:5" role="region" aria-label="drift versus noise, simulated">
  <div class="ph">
    <span class="dkb-t"><b class="pk">◆</b> <b>drift vs noise</b> <i class="dkb-ph-s">— law of large numbers</i></span>
    <span class="dkb-hn"><span class="dkb-halt">halted</span><b id="dkb-dn" class="num">140</b> paths</span>
  </div>
  <div class="dkb-bh dkb-dh">
    <div class="dkb-big dkb-cap">
      <label>P(profit) · n=<span id="dkb-tr">44</span></label>
      <div class="dkb-bv"><span id="dkb-pp" class="num">91.4</span><small>%</small></div>
    </div>
    <div class="dkb-kv">
      <div><label>drift / step</label><b class="num dkb-vi">+0.80bp</b></div>
      <div><label>noise σ / step</label><b class="num dkb-or">8.6bp</b></div>
    </div>
  </div>
  <div class="dkb-cvw" id="dkb-dw">
    <canvas id="dkb-ds" aria-hidden="true"></canvas>
    <canvas id="dkb-dp" data-dpr="1.5" aria-hidden="true"></canvas>
    <canvas id="dkb-dq" data-dpr="1.5" aria-hidden="true"></canvas>
    <canvas id="dkb-do" tabindex="0" title="hover a path to trace it · on the right edge, read how many paths sit above a level · arrows move the probe, esc clears" role="img" aria-label="one hundred and forty simulated random-walk equity curves with a small positive drift fanning out left to right, with a live histogram of their values on the right edge"></canvas>
  </div>
  <div class="dkb-df">
    <span class="dkb-gr" aria-hidden="true"><i>loss</i><u></u><i>profit</i></span>
    <span class="dkb-lk"><em class="dkb-kd" aria-hidden="true"></em>drift<em class="dkb-kn" aria-hidden="true"></em>±2σ noise</span>
    <span class="dkb-pool">pooled <b id="dkb-pool" class="num">91.6%</b> over <b id="dkb-runs" class="num">1 run</b></span>
  </div>
</div>
