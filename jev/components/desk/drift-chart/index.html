<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drift vs noise · JEV component</title><meta name="theme-color" content="#05030a">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Space+Grotesk:wght@500;600;700&family=Fraunces:opsz,wght@9..144,700;9..144,900&display=swap" media="print" onload="this.media='all'">
<style>/* ===== JEV base — tokens + shared primitives. Modules add their own css/<module>.css and never edit this file. ===== */
:root {
  --bg: #05030a; --bg2: #0b0711; --ink: #f4eef6; --mut: #8d8499; --dim: #837a8f; /* dim: >= 4.5:1 on --bg and on the card panels, still one step under --mut */
  --pink: #ff2e6e; --pink2: #ff7ab3; --green: #2ee6a6; --blue: #4d8dff; --amber: #ffc13d; --violet: #a66bff;
  --orange: #ff8a3d; --cyan: #3be0ff; --red: #ff4d5e; --up: #2ee6a6; --dn: #ff4d5e;
  --line: rgba(255, 255, 255, .08); --line2: rgba(255, 255, 255, .14);
  --panel: linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .016));
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
  --sans: 'Space Grotesk', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --serif: 'Fraunces', 'Playfair Display', 'Iowan Old Style', Georgia, serif;
  --gut: clamp(12px, 3vw, 32px);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --tint: 255, 46, 110; /* section colour temperature: core eases it per section (hero pink · builds magenta · hour amber · desk blue-violet · lab green) */
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; color-scheme: dark; scroll-padding-top: calc(var(--hud-h, 56px) + 10px); scrollbar-width: thin; scrollbar-color: rgba(255, 46, 110, .45) #0b0711; }
body { background: var(--bg); color: var(--ink); font: 400 12.5px/1.55 var(--mono); overflow-x: hidden; -webkit-font-smoothing: antialiased; min-height: 100vh; min-height: 100svh; }
main { display: block; }
.skip { position: fixed; left: 12px; top: -60px; z-index: 200; padding: 10px 14px; border-radius: 8px; background: var(--pink); color: #fff; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 11px; transition: top .15s; }
.skip:focus { top: 10px; outline: 2px solid #fff; outline-offset: 2px; }
.skip:focus-visible { box-shadow: 0 0 22px rgba(255, 46, 110, .7); }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
::selection { background: rgba(255, 46, 110, .88); color: #fff; text-shadow: none; }
::-webkit-scrollbar { width: 9px; height: 9px; } ::-webkit-scrollbar-track { background: #0b0711; }
::-webkit-scrollbar-thumb { background: linear-gradient(180deg, rgba(255, 46, 110, .55), rgba(166, 107, 255, .4)); border-radius: 9px; border: 2px solid #0b0711; }
::-webkit-scrollbar-thumb:hover { background: var(--pink); }
/* focus ring system: one pink ring, 2px offset, for every interactive element (modules may refine the colour, never remove it) */
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--pink2); outline-offset: 2px; }
:is(button, a, [role="button"], summary):focus-visible { box-shadow: 0 0 0 5px rgba(255, 46, 110, .22), 0 0 18px rgba(255, 46, 110, .4); }
:is(.m, .mets):focus-visible { outline-offset: 3px; }
main:focus, main:focus-visible, section:focus, [tabindex="-1"]:focus { outline: none; box-shadow: none; }
:target { scroll-margin-top: calc(var(--hud-h, 56px) + 10px); }
main > section[id], h2[id] { scroll-margin-top: calc(var(--hud-h, 56px) + 4px); }
canvas { display: block; }
.wrap { max-width: 1380px; margin: 0 auto; padding: 0 var(--gut); position: relative; }
.sec { position: relative; padding: clamp(34px, 5vw, 72px) 0 clamp(28px, 4vw, 56px); } /* was 100/100: ~210px of nothing between sections */
.hide-s { } .show-s { display: none; }
@media (max-width: 700px) { .hide-s { display: none !important; } .show-s { display: initial; } }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mut { color: var(--mut); } .dim { color: var(--dim); } .hot { color: var(--pink); } .up { color: var(--up); } .dn { color: var(--dn); }
.sans { font-family: var(--sans); } .serif { font-family: var(--serif); } .num { font-variant-numeric: tabular-nums; }

/* accent hook: <el data-c="pink|gray|green|blue|yellow|violet|orange|cyan|red"> exposes --cc / --cc-rgb */
[data-c="pink"] { --cc: #ff6fa6; --cc-rgb: 255,111,166; } [data-c="gray"] { --cc: #b8b2c2; --cc-rgb: 184,178,194; }
[data-c="green"] { --cc: #35e0a8; --cc-rgb: 53,224,168; } [data-c="blue"] { --cc: #5a8cff; --cc-rgb: 90,140,255; }
[data-c="yellow"] { --cc: #ffc53d; --cc-rgb: 255,197,61; } [data-c="violet"] { --cc: #a66bff; --cc-rgb: 166,107,255; }
[data-c="orange"] { --cc: #ff8a3d; --cc-rgb: 255,138,61; } [data-c="cyan"] { --cc: #3be0ff; --cc-rgb: 59,224,255; }
[data-c="red"] { --cc: #ff4d5e; --cc-rgb: 255,77,94; }

/* ----- section heading kit ----- */
.sec-head { margin-bottom: clamp(22px, 3.4vw, 44px); }
.eb { display: flex; align-items: center; gap: 12px; font-size: 10px; letter-spacing: .26em; text-transform: uppercase; color: var(--pink); margin-bottom: 14px; }
.eb::before { content: ''; width: 34px; height: 1px; background: linear-gradient(90deg, transparent, var(--pink)); box-shadow: 0 0 10px var(--pink); }
.eb i { font-style: normal; color: var(--mut); letter-spacing: .2em; }
.h2 { font: 700 clamp(26px, 4.6vw, 60px)/1.02 var(--sans); letter-spacing: -.02em; max-width: 22ch; text-wrap: balance; }
.h2 em { --em-sh: 0 0 28px rgba(var(--tint), .55); font-style: normal; color: var(--pink); text-shadow: var(--em-sh); }
/* split-text headings (core.js JEV.splitText): letters rise in, staggered by --i; the <em> letters then catch a travelling glint (--j) */
.h2.st-ready .st-w { display: inline-block; white-space: nowrap; }
.h2.st-ready .st-c { display: inline-block; opacity: 0; transform: translate3d(0, .62em, 0) rotate(4deg); transform-origin: 0 100%; }
html[data-tier="3"] .h2.st-ready .st-c { filter: blur(7px); }
html[data-tier="3"] .h2.st-in .st-c { filter: none; }
.h2.st-in .st-c { opacity: 1; transform: none; filter: none; transition: opacity .6s var(--ease), transform .85s var(--ease), filter .7s var(--ease); transition-delay: calc(var(--i, 0) * 15ms + 90ms); }
.h2.st-in em .st-c { animation: stGlint 7.5s linear 2; animation-delay: calc(var(--j, 0) * 75ms + 1.2s); }
html[data-tier="3"] .h2.st-in em .st-c { animation-iteration-count: infinite; }
@keyframes stGlint { 6% { color: #fff; text-shadow: 0 0 18px #fff, 0 0 38px rgba(var(--tint), .95); } 15%, 100% { color: var(--pink); text-shadow: var(--em-sh); } }
html[data-tier="1"] .h2.st-ready .st-c { opacity: 1; transform: none; filter: none; transition: none; animation: none; }
/* eyebrow hairline draws itself as the head lands */
.sec-head.rv .eb::before { transform: scaleX(0); transform-origin: 100% 50%; transition: transform .9s var(--ease) .25s; }
.sec-head.rv.in .eb::before { transform: none; }
/* cross-light: a fixed, static colour-temperature wash under the content (above the fx plasma at z -2); only its colour eases between sections */
body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(62% 46% at 6% -4%, rgba(var(--tint), .11), transparent 72%), radial-gradient(54% 42% at 104% 102%, rgba(var(--tint), .08), transparent 72%); }
.lede { color: var(--mut); max-width: 66ch; margin-top: 14px; font-size: 12.5px; }
/* wide screens: headline left, lede (+ optional live slot) right, bottom-aligned - instead of a 22ch headline with the right 40% empty.
   :where() keeps this at zero specificity so module heads (.bld-head, .code-head, anything with its own grid) override freely */
@media (min-width: 1100px) {
  :where(.sec-head:not(.bld-head, .code-head)) { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 34%); column-gap: clamp(36px, 5vw, 80px); align-items: end; }
  :where(.sec-head:not(.bld-head, .code-head)) > :where(.eb) { grid-column: 1 / -1; }
  :where(.sec-head:not(.bld-head, .code-head)) > :where(.h2) { grid-column: 1; grid-row: 2; }
  :where(.sec-head:not(.bld-head, .code-head)) > :where(.lede, .sec-aside) { grid-column: 2; grid-row: 2; align-self: end; margin: 0 0 .5em; padding-left: clamp(16px, 2vw, 26px);
    border-left: 1px solid transparent; border-image: linear-gradient(180deg, rgba(255, 46, 110, .75), rgba(255, 46, 110, 0)) 1; }
}
.sec-aside { margin-top: 14px; }
.sec-aside > .lede { margin: 0; padding: 0; border: 0; }
.sec-live { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 14px; font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.sec-live span { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line2); background: rgba(255, 255, 255, .03); color: var(--mut); }
.sec-live i { width: 6px; height: 6px; border-radius: 50%; background: var(--cc, var(--pink)); box-shadow: 0 0 8px var(--cc, var(--pink)); }
.sec-live small { font-size: inherit; margin-right: 4px; }
@media (max-width: 699px) { .sec-live small { flex: 1 0 100%; margin: 0; } }
.sec-live b { min-width: 2ch; color: var(--ink); font-weight: 700; letter-spacing: .04em; font-variant-numeric: tabular-nums; }

/* ----- cards with a pointer-lit border (fx sets --mx/--my on pointermove) ----- */
.card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); overflow: hidden; }
.card::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; opacity: 0; transition: opacity .35s;
  background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 0%), rgba(255, 70, 130, .95), rgba(255, 70, 130, 0) 60%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.card::after { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .35s; background: radial-gradient(320px circle at var(--mx, 50%) var(--my, 0%), rgba(255, 60, 120, .07), transparent 70%); }
.card:hover::before, .card:hover::after { opacity: 1; }
.ph { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 14px 0; font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--mut); }
.ph b { color: var(--ink); font-weight: 700; } .ph .pk { color: var(--pink); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 99px; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; border: 1px solid var(--line2); color: var(--mut); background: rgba(255, 255, 255, .03); }
.lamp { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green), 0 0 18px var(--green); animation: lampPulse 1.6s ease-in-out infinite; vertical-align: middle; }
.lamp.pink { background: var(--pink); box-shadow: 0 0 8px var(--pink), 0 0 18px var(--pink); } .lamp.amber { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
@keyframes lampPulse { 50% { opacity: .35; transform: scale(.8); } }
/* core.js toggles .is-off on sections / cards / stages that are > 200px outside the viewport: their CSS animations pause (every running animation costs a style invalidation per frame) */
.is-off, .is-off *, .is-off *::before, .is-off *::after { animation-play-state: paused !important; }

/* ----- toggle switch: <div class="sw on" data-c="orange"><i class="tg"></i></div> ----- */
.tg { display: inline-block; width: 46px; height: 24px; border-radius: 99px; position: relative; background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .14); transition: background .45s var(--ease), border-color .45s, box-shadow .45s; flex: none; }
.tg::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #7a7285; transition: left .45s var(--ease), background .45s, box-shadow .45s; }
.on > .tg, .tg.on { background: rgba(var(--cc-rgb, 255, 46, 110), .22); border-color: var(--cc, var(--pink)); box-shadow: 0 0 16px rgba(var(--cc-rgb, 255, 46, 110), .5); }
.on > .tg::after, .tg.on::after { left: 25px; background: var(--cc, var(--pink)); box-shadow: 0 0 10px var(--cc, var(--pink)); }

/* ----- mascot orb (Jev family): <span class="orb pink" style="--s:90px"><i class="e l"></i><i class="e r"></i></span> ----- */
.orb { --s: 90px; --c1: #8fbcff; --c2: #2a5cff; --g: rgba(80, 140, 255, .6); position: relative; display: inline-block; width: var(--s); height: var(--s); border-radius: 50%; flex: none;
  background: radial-gradient(circle at 32% 24%, rgba(255, 255, 255, .95) 0 5%, var(--c1) 24%, var(--c2) 68%, rgba(0, 0, 0, .55) 108%);
  box-shadow: 0 0 calc(var(--s) * .55) var(--g), inset -6px -10px 18px rgba(0, 0, 0, .38), inset 4px 6px 12px rgba(255, 255, 255, .22); }
.orb .e { position: absolute; top: 37%; width: 14%; height: 29%; border-radius: 99px; background: #0a0710; translate: var(--ex, 0) var(--ey, 0); animation: orbBlink 5.5s infinite; }
.orb .e.l { left: 30%; rotate: -13deg; } .orb .e.r { right: 30%; rotate: 13deg; animation-delay: .06s; }
@keyframes orbBlink { 0%, 93%, 100% { scale: 1 1; } 96% { scale: 1 .08; } }
.orb.pink { --c1: #ff9cc4; --c2: #ff1f75; --g: rgba(255, 46, 120, .65); } .orb.blue { --c1: #8fbcff; --c2: #2a5cff; }
.orb.white { --c1: #ffffff; --c2: #d9d2e6; --g: rgba(255, 255, 255, .45); } .orb.amber { --c1: #ffe08a; --c2: #ff9f1a; --g: rgba(255, 180, 40, .6); }
.orb.green { --c1: #8ff5cf; --c2: #12b57e; --g: rgba(46, 230, 166, .55); } .orb.violet { --c1: #cdaaff; --c2: #7a3df0; --g: rgba(166, 107, 255, .6); }
.orb.red { --c1: #ffa08f; --c2: #f0401f; --g: rgba(255, 90, 50, .6); } .orb.orange { --c1: #ffc08f; --c2: #ff6a0f; --g: rgba(255, 138, 61, .6); }
.orb.cyan { --c1: #a6f1ff; --c2: #18a8d8; --g: rgba(59, 224, 255, .55); }

/* ----- glitch wordmark: <span class="glitch" data-text="JEV">JEV</span> ----- */
.glitch { position: relative; display: inline-block; }
.glitch::before, .glitch::after { content: attr(data-text); position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen; }
.glitch::before { color: #00f0ff; animation: gl1 7s infinite steps(1); } .glitch::after { color: #ff2e6e; animation: gl2 7s infinite steps(1); }
@keyframes gl1 { 0%, 92%, 100% { opacity: 0; transform: none; } 93% { opacity: .9; transform: translate(-4px, 1px); clip-path: inset(8% 0 62% 0); } 95% { opacity: .9; transform: translate(3px, -2px); clip-path: inset(56% 0 10% 0); } 97% { opacity: .9; transform: translate(-2px, 0); clip-path: inset(30% 0 40% 0); } }
@keyframes gl2 { 0%, 92%, 100% { opacity: 0; transform: none; } 94% { opacity: .9; transform: translate(4px, -1px); clip-path: inset(52% 0 14% 0); } 96% { opacity: .9; transform: translate(-3px, 2px); clip-path: inset(12% 0 58% 0); } 98% { opacity: .9; transform: translate(2px, 0); clip-path: inset(40% 0 30% 0); } }

/* ----- scroll reveal (fx adds .in when visible) ----- */
.rv { opacity: 0; transform: translateY(26px) scale(.985); filter: blur(7px); transition: opacity .9s var(--ease), transform .9s var(--ease), filter .9s var(--ease); transition-delay: calc(var(--i, 0) * 70ms); }
.rv.in, .no-js .rv { opacity: 1; transform: none; filter: none; }

/* ----- HUD ----- */
.hud { position: sticky; top: 0; z-index: 60; display: flex; align-items: center; gap: clamp(8px, 2vw, 26px); padding: 8px max(var(--gut), env(safe-area-inset-right)) 8px max(var(--gut), env(safe-area-inset-left)); background: linear-gradient(180deg, rgba(5, 3, 10, .94), rgba(5, 3, 10, .62)); backdrop-filter: blur(14px) saturate(1.5); -webkit-backdrop-filter: blur(14px) saturate(1.5); border-bottom: 1px solid rgba(var(--tint), .22); }
.hud-scan { position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; overflow: hidden; pointer-events: none; opacity: .85; }
.hud-scan::after { content: ''; position: absolute; left: 0; top: 0; width: 28%; height: 100%; background: linear-gradient(90deg, transparent, var(--pink), #fff, var(--pink), transparent); animation: hudScan 5.5s linear infinite; } /* compositor-only (was a background-position loop) */
@keyframes hudScan { from { transform: translateX(-103%); } to { transform: translateX(360%); } }
.logo { display: flex; align-items: center; gap: 9px; flex: none; }
.logo b { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; font: 800 19px/1 var(--sans); color: #fff; background: linear-gradient(145deg, #ff4f8d, #e0155a); box-shadow: 0 0 22px rgba(255, 46, 110, .6), inset 0 1px 0 rgba(255, 255, 255, .4); }
.logo span { font: 700 15px/1 var(--sans); letter-spacing: .12em; }
.mets { display: flex; gap: clamp(12px, 2.2vw, 32px); flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; align-items: center; }
.mets::-webkit-scrollbar { display: none; }
.m { flex: none; } .m label { display: block; font-size: 9px; letter-spacing: .2em; color: var(--dim); text-transform: uppercase; }
.m { border-radius: 6px; cursor: default; }
.m b { display: block; font-size: 14px; font-weight: 700; letter-spacing: .02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
/* odometer: each digit is a 0-9 reel; the transform eases with a tiny overshoot, like a mechanical counter */
.od { display: inline-flex; vertical-align: top; } .od-s { display: inline-block; height: 1.55em; }
.od-d { display: inline-block; height: 1.55em; overflow: hidden; }
.od-r { display: block; transform: translateY(calc(var(--d, 0) * -1.55em)); transition: transform .62s cubic-bezier(.2, .9, .25, 1.12); will-change: transform; }
.od-r i { display: block; height: 1.55em; line-height: 1.55em; font-style: normal; }
.hud-prog { display: none;  position: absolute; left: 0; right: 0; top: 0; height: 2px; transform: scaleX(0); transform-origin: 0 50%; pointer-events: none; background: linear-gradient(90deg, var(--violet), var(--pink), var(--pink2)); box-shadow: 0 0 10px rgba(255, 46, 110, .7); will-change: transform; }
body.killed .hud-prog { background: var(--red); }
.hud-tip { position: fixed; z-index: 90; max-width: min(270px, calc(100vw - 16px)); padding: 9px 12px; border-radius: 10px; font-size: 10.5px; line-height: 1.5; letter-spacing: .02em; color: var(--ink); pointer-events: none;
  background: rgba(12, 7, 20, .96); border: 1px solid rgba(255, 46, 110, .4); box-shadow: 0 12px 36px rgba(0, 0, 0, .6), 0 0 22px rgba(255, 46, 110, .16); opacity: 0; transform: translateY(-4px); visibility: hidden; transition: opacity .16s, transform .2s var(--ease), visibility 0s .2s; }
.hud-tip.on { opacity: 1; transform: none; visibility: visible; transition-delay: 0s; }
.hud-help { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 12px/1 var(--mono); color: var(--mut); border: 1px solid var(--line2); background: rgba(255, 255, 255, .03); transition: color .25s, border-color .25s, background .25s; }
.hud-help:hover { color: #fff; border-color: rgba(255, 46, 110, .6); background: rgba(255, 46, 110, .16); }
@media (pointer: coarse) { .hud-help { width: 40px; height: 40px; } }
.nav { display: flex; gap: 2px; flex: none; }
.nav a { padding: 6px 10px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--mut); border-radius: 7px; transition: color .25s, background .25s; }
.nav a:hover { color: #fff; background: rgba(255, 46, 110, .16); } .nav a:active { transform: scale(.96); }
.nav a i { font-style: normal; }
@media (max-width: 1239px) { .nav a { padding: 6px 8px; } .nav a i { display: none; } } /* compact: drop the 01-05 numerals before dropping the nav */
@media (max-width: 999px) { .nav { display: none; } } /* below this the metrics would start to clip */
@media (pointer: coarse) { .nav a { display: inline-flex; align-items: center; min-height: 40px; } .kill { min-height: 40px; } .logo { min-height: 40px; min-width: 40px; } .m label { font-size: 10px; } }
@media (max-width: 400px) { .hide-xs { display: none; } } /* keep Cost inside the metric strip on 360px phones */
.kill { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 99px; font-size: 10px; font-weight: 700; letter-spacing: .16em; border: 1px solid rgba(46, 230, 166, .45); color: var(--green); background: rgba(46, 230, 166, .07); transition: .3s; }
.kill i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); animation: lampPulse 1.6s infinite; }
.kill:hover { background: rgba(46, 230, 166, .16); } .kill:active { transform: scale(.95); } .kill:focus-visible { outline-color: var(--green); box-shadow: 0 0 18px rgba(46, 230, 166, .45); } body.killed .kill:focus-visible { outline-color: var(--red); box-shadow: 0 0 18px rgba(255, 77, 94, .5); }

<script>
/* JEV trading decision engine — pure JS, no DOM. Loaded before core.js.
 * A small hand-tuned scoring head: numeric market/risk state in, typed answers out.
 * It is a DEMO heuristic (not a trained model, not financial advice); all values are simulated. */
(function (root) {
  'use strict';
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sig = (x) => 1 / (1 + Math.exp(-x));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[(Math.random() * a.length) | 0];

  const RULES = { floor: 0.85, lossCap: 2000, maxPos: 4 }; // gate floor · daily loss cap (USD) · max position (% of capital)
  const ACTIONS = ['buy', 'sell', 'hold', 'close', 'flatten'];
  const SIZES = [0.5, 1, 2, 4]; // % of capital, "how much?" buckets
  const STATE_KEYS = ['symbol', 'price', 'vwap_dist_bps', 'spread_bps', 'imbalance', 'funding_bps', 'vol_1h',
    'edge_bps', 'position_pct', 'daily_pnl', 'drawdown_pct', 'latency_ms', 'signal_age_s', 'venue', 'regime'];

  function softmax(lg, T) {
    const ks = Object.keys(lg), mx = Math.max.apply(null, ks.map((k) => lg[k]));
    const ex = ks.map((k) => Math.exp((lg[k] - mx) / T)), z = ex.reduce((a, b) => a + b, 0), p = {};
    ks.forEach((k, i) => (p[k] = ex[i] / z));
    return p;
  }
  const argmax = (p) => Object.keys(p).reduce((a, b) => (p[a] >= p[b] ? a : b));

  /* state: edge_bps, imbalance(-1..1), spread_bps, vol(annualised %), position_pct(signed), daily_pnl(USD),
   *        drawdown_pct, latency_ms, signal_age_s    opt: {floor, killed}                                      */
  function decide(s, opt) {
    opt = opt || {};
    const floor = Number.isFinite(+opt.floor) && opt.floor != null ? +opt.floor : RULES.floor, killed = !!opt.killed;
    const edge = s.edge_bps, imb = s.imbalance, spr = s.spread_bps, vol = s.vol != null ? s.vol : s.vol_1h;
    const pos = s.position_pct, dd = s.drawdown_pct, pnl = s.daily_pnl, lat = s.latency_ms, age = s.signal_age_s;
    const stale = clamp((age - 20) / 50, 0, 1);
    const room = clamp((RULES.maxPos - Math.abs(pos)) / RULES.maxPos, 0, 1);
    const cost = spr * 0.6 + 2; // fees + slippage, bps
    const net = Math.sign(edge) * Math.max(0, Math.abs(edge) - cost); // edge net of costs, sign kept
    const lossUse = clamp(-pnl / RULES.lossCap, 0, 1.5);
    const stress = Math.max(0, dd - 5) * 0.45 + Math.max(0, vol - 115) * 0.035 + Math.max(0, lossUse - 0.7) * 5;
    const opp = Math.abs(pos) > 0.2 ? 2.2 : 0; // trading against an open position is "close", not buy/sell
    const lg = {
      buy: 0.14 * net + 1.3 * imb - 1.8 * stale + 0.9 * (room - 0.4) - 0.5 * stress - (pos < -0.2 ? opp : 0),
      sell: -0.14 * net - 1.3 * imb - 1.8 * stale + 0.9 * (room - 0.4) - 0.5 * stress - (pos > 0.2 ? opp : 0),
      hold: 0.7 + 0.05 * spr + 1.7 * stale - 0.1 * Math.abs(net) - 0.9 * Math.abs(imb) - 0.4 * stress,
      close: Math.abs(pos) > 0.2 ? 0.2 * (-Math.sign(pos) * net) + 1.2 * (-Math.sign(pos) * imb) - 0.4 + 0.5 * (1 - room) - 0.2 * stress : -4,
      flatten: -2.6 + 1.0 * stress + (Math.abs(pos) > 0.2 ? 0.4 : -2),
    };
    const p = softmax(lg, 0.55), action = argmax(p), conf = p[action];

    // how much? — score bucket, never beyond the room left under the position cap
    const raw = clamp(Math.abs(net) / 32, 0, 1) * (1 - clamp(vol - 40, 0, 140) / 220) * (1 - clamp(dd / 12, 0, 0.9));
    const maxSize = Math.max(0.5, RULES.maxPos - Math.abs(pos));
    let sizeIdx = raw < 0.14 ? 0 : raw < 0.34 ? 1 : raw < 0.62 ? 2 : 3;
    while (sizeIdx > 0 && SIZES[sizeIdx] > maxSize) sizeIdx--;
    const sizeP = softmax({ s0: -Math.abs(raw - 0.07) * 9, s1: -Math.abs(raw - 0.24) * 9, s2: -Math.abs(raw - 0.48) * 9, s3: -Math.abs(raw - 0.8) * 9 }, 0.6);
    const sizes = [sizeP.s0, sizeP.s1, sizeP.s2, sizeP.s3];
    // keep the p(size) bars consistent with the answer: nothing above the chosen (room-capped) bucket, and it is the argmax
    for (let i = sizeIdx + 1; i < 4; i++) sizes[i] = 0;
    sizes[sizeIdx] = Math.max.apply(null, sizes);
    const sz = sizes.reduce((a, b) => a + b, 0); for (let i = 0; i < 4; i++) sizes[i] /= sz;

    // yes or no? — is it safe to send
    const riskOk = spr <= 8 && lat <= 300 && age <= 45 && lossUse < 0.8 && dd < 8 && vol < 160 && !killed;
    const pRisk = sig(2.4 - 0.22 * spr - 0.006 * lat - 0.04 * age - 3 * lossUse - 0.3 * dd - 0.015 * Math.max(0, vol - 90) - (killed ? 8 : 0));

    let dest, reason;
    if (action === 'hold') { dest = 'skip'; reason = 'hold'; }
    else if (killed) { dest = 'review'; reason = 'kill switch'; }
    else if (!riskOk && action !== 'flatten' && action !== 'close') { dest = 'review'; reason = 'risk flag'; }
    else if ((action === 'buy' && pos > 0 || action === 'sell' && pos < 0) && Math.abs(pos) + SIZES[sizeIdx] > RULES.maxPos + 1e-9) { dest = 'review'; reason = 'position cap'; } // adding to a book already at the cap; opposite-side orders reduce exposure
    else if (!Number.isFinite(conf) || !Number.isFinite(net)) { dest = 'review'; reason = 'bad input'; } // fail closed on NaN / Infinity
    else if (!(conf >= floor)) { dest = 'review'; reason = 'conf ' + conf.toFixed(2) + ' < ' + floor.toFixed(2); }
    else { dest = 'execute'; reason = 'ok'; }

    return { action, p, conf, sizeIdx, size: SIZES[sizeIdx], sizes, sizeRaw: raw, riskOk, pRisk, dest, reason,

  }

  const ARCH = [

        if (a.classList.contains('fx-done') || (a.classList.contains('in') && getComputedStyle(a).transform === 'none')) continue;
        const done = (e) => { if (e.target !== a || e.propertyName !== 'transform') return; a.removeEventListener('transitionend', done); kick(); };

  };
  J.onView = (el, cb, o) => {
    o = o || {};
    const i2 = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { cb(e); if (o.once !== false) i2.disconnect(); } }), { threshold: o.threshold == null ? 0.15 : o.threshold, rootMargin: o.rootMargin || '0px' });

  };

  /* ---------- text fx ---------- */
  J.countTo = (el, to, o) => {
    o = o || {}; const from = o.from || 0, dur = (o.dur || 1400) / (J.reduce ? 1000 : 1), f = o.fmt || ((v) => J.fmt(Math.round(v)));
    const t0 = performance.now();
    const step = (now) => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = f(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  };
  const SC = '▓▒░<>/\\|—_+*#@%&01';

    text = text == null ? el.textContent : text; ms = (ms || 900) / (J.reduce ? 1000 : 1);

      const p = Math.min(1, (now - t0) / ms); let s = '';

  };

  /* ---------- global state, rules, kill switch ---------- */
  J.RULES = E.RULES; J.ACTIONS = E.ACTIONS; J.SIZES = E.SIZES; J.STATE_KEYS = E.STATE_KEYS;
  const S = (J.S = { killed: false, floor: E.RULES.floor, count: 1892, cost: 0.046, ms: [3.1, 3.4, 2.9, 3.2, 3.6], counts: { choice: 1934, flag: 1102, score: 600 }, dest: { execute: 0, review: 0, skip: 0 } });
  J.setFloor = (v) => { if (!isFinite(+v) || v === null || v === '') return; S.floor = J.clamp(+v, 0.5, 0.99); E.RULES.floor = S.floor; J.bus.emit('floor', S.floor); hud(); };

  /* ---------- shared catalogues (modules read, never mutate) ---------- */
  /** ten builds — all are the same decision layer asking typed questions (choice | score | flag) */
  J.BUILDS = [
    { key: 'entry', name: 'entry gate', tag: 'ENTER', col: 'pink', prim: 'choice', k1: 'picks', v1: 'buy · sell · hold', ms: 3.2 },
    { key: 'sizer', name: 'position sizer', tag: 'SIZE', col: 'gray', prim: 'score', k1: 'picks', v1: '0.5% → 4%', ms: 2.8 },
    { key: 'guard', name: 'risk guard', tag: 'RISK', col: 'pink', prim: 'flag', k1: 'asks', v1: 'risk_ok?', ms: 2.1 },
    { key: 'router', name: 'venue router', tag: 'ROUTE', col: 'gray', prim: 'choice', k1: 'picks', v1: 'which venue', ms: 4.4 },
    { key: 'exit', name: 'exit manager', tag: 'EXIT', col: 'pink', prim: 'choice', k1: 'picks', v1: 'close · hold', ms: 3.6 },
    { key: 'funding', name: 'funding carry', tag: 'CARRY', col: 'gray', prim: 'score', k1: 'scores', v1: 'basis · funding', ms: 5.1 },
    { key: 'news', name: 'headline filter', tag: 'NEWS', col: 'pink', prim: 'flag', k1: 'asks', v1: 'trade or ignore', ms: 6.3 },
    { key: 'mm', name: 'quote skew', tag: 'MAKER', col: 'gray', prim: 'score', k1: 'scores', v1: 'widen · tighten', ms: 2.6 },
    { key: 'liq', name: 'liquidation guard', tag: 'FLATTEN', col: 'pink', prim: 'flag', k1: 'asks', v1: 'flatten now?', ms: 1.9 },
    { key: 'rebal', name: 'rebalancer', tag: 'ALLOC', col: 'gray', prim: 'choice', k1: 'picks', v1: 'which asset', ms: 7.8 },
  ];
  /** the six desk agents (screenshot: prior · kelly · closer · spotter · edge · taker) */
  J.AGENTS = [
    { key: 'spotter', name: 'SPOTTER', role: 'scans books and venues', col: '#2ee6a6' },
    { key: 'prior', name: 'PRIOR', role: 'prior from history', col: '#ffc13d' },
    { key: 'edge', name: 'EDGE', role: 'fair value vs market', col: '#ff2e6e' },
    { key: 'kelly', name: 'KELLY', role: 'sizes the ticket', col: '#a66bff' },
    { key: 'taker', name: 'TAKER', role: 'crosses the spread', col: '#4d8dff' },
    { key: 'closer', name: 'CLOSER', role: 'takes profit / stops', col: '#ff8a3d' },

  J.TRIO = [
    { key: 'hermes', name: 'HERMES', line: 'writes the strategy and the risk rules', sub: 'hermes agent · strategy.yaml', col: '#ff8a3d' },
    { key: 'dots', name: 'DOTS', line: 'pulls and cleans four years of data', sub: 'the data side', col: '#4d8dff' },
    { key: 'jev', name: 'JEV', line: 'backtests, caps and arms it', sub: 'the gate · cap · kill switch · orders', col: '#ff2e6e' },

  /* ---------- tab visibility ---------- */
  /* A hidden tab gets no animation frames, so document.timeline stands still and every Element.animate() a 'decision'/'tick' handler starts can never finish:

  /* ---------- simulated market (4 Hz) ---------- */
  const M = (J.market = { price: 84722, open: 84722, hist: [], vol: 0.00016 });
  let tickT = 0;
  const tick = () => {
    const dp = M.price * (J.gauss() * M.vol + (84722 - M.price) * 1e-6);
    M.price = Math.max(1000, M.price + dp);
    M.hist.push(M.price); if (M.hist.length > 1200) M.hist.shift();
    J.bus.emit('tick', { price: M.price, dp });
  };
  const runTick = (on) => { if (on && !tickT) tickT = setInterval(tick, 250); else if (!on && tickT) { clearInterval(tickT); tickT = 0; } };
  runTick(!document.hidden);
  for (let i = 0; i < 300; i++) { M.price += M.price * J.gauss() * M.vol; M.hist.push(M.price); }

  /* ---------- live decision stream (real engine on sampled states) ---------- */
  J.recent = [];
  let seq = 0;
  function pickBuild(d) {
    if (d.action === 'buy' || d.action === 'sell') return J.pick(['entry', 'entry', 'entry', 'router', 'sizer', 'guard']);
    if (d.action === 'close') return J.pick(['exit', 'exit', 'guard']);
    if (d.action === 'flatten') return J.pick(['liq', 'liq', 'guard']);
    return J.pick(['news', 'mm', 'funding', 'rebal', 'guard']);
  }
  J.decide = (state, o) => E.decide(state, Object.assign({ floor: S.floor, killed: S.killed }, o));
  J.makeDecision = () => {
    const sm = E.sampleState(() => M.price);
    const d = J.decide(sm.state);
    // display confidence: slight organic jitter on top of the engine output
    d.conf = J.clamp(d.conf * (0.965 + Math.random() * 0.035), 0.3, 0.995);
    if (d.dest === 'execute' && d.conf < S.floor) { d.dest = 'review'; d.reason = 'conf ' + d.conf.toFixed(2) + ' < ' + S.floor.toFixed(2); }
    else if (d.reason.indexOf('conf ') === 0) d.reason = 'conf ' + d.conf.toFixed(2) + ' < ' + S.floor.toFixed(2); // reason quotes the displayed (jittered) confidence
    d.id = (++seq).toString(16).padStart(4, '0') + Math.random().toString(16).slice(2, 6);
    d.state = sm.state; d.arch = sm.arch; d.build = pickBuild(d);
    d.symbol = sm.state.symbol; d.venue = sm.state.venue;
    d.line = d.symbol + ' edge ' + J.sgn(sm.state.edge_bps) + 'bps imb ' + J.sgn(sm.state.imbalance, 2) + ' spr ' + sm.state.spread_bps.toFixed(1);
    return d;
  };
  /** emit one decision now (counters + bus). Used by the live stream and by manual triggers (clicks). */
  J.fire = () => {
    const d = J.makeDecision();
    S.count++; S.cost += 0.00003; S.ms.push(d.ms); if (S.ms.length > 41) S.ms.shift();
    S.counts.choice++; if (Math.random() < 0.55) S.counts.flag++; if (Math.random() < 0.3) S.counts.score++;
    S.dest[d.dest]++;

  };
  let loopT = 0, started = false;
  function loop() { loopT = 0; if (document.hidden) return; try { J.fire(); } catch (e) { console.error('[loop]', e); } loopT = setTimeout(loop, 700 + Math.random() * 650); }
  J.start = () => { started = true; if (!document.hidden && !loopT) loopT = setTimeout(loop, 400); };
  document.addEventListener('visibilitychange', () => {
    const on = !document.hidden;
    runTick(on);
    if (on) { if (started && !loopT) loopT = setTimeout(loop, 500 + Math.random() * 600); } // resume gently, nothing queued while away
    else { clearTimeout(loopT); loopT = 0; }

  /* ---------- HUD (header metrics + kill switch) ---------- */

  const hudEls = {};

      el.append(wrap, sr);
    } else {
      let i = 0; for (const ch of text) { if (ch >= '0' && ch <= '9') wrap.children[i].firstChild.style.setProperty('--d', ch); i++; }
    }
    el.__ods.textContent = text;
    return prev;
  }
  const flash = (el) => { if (el && !J.reduce) J.animate(el, [{ textShadow: '0 0 12px rgba(255,46,110,.95)', color: '#fff' }, { offset: 1 }], { duration: 520, easing: 'ease-out' }); };
  function hud() {
    const set = (id, v) => { const el = hudEls[id] || (hudEls[id] = document.getElementById(id)); if (el && el.textContent !== v) { const had = el.textContent; el.textContent = v; return had; } };
    odo(hudEls.mDec || (hudEls.mDec = document.getElementById('mDec')), J.fmt(S.count));
    const cEl = hudEls.mCost || (hudEls.mCost = document.getElementById('mCost')), cPrev = cEl && cEl.__od;
    odo(cEl, '$' + S.cost.toFixed(3)); if (cPrev && cPrev !== cEl.__od && hudEls.ready) flash(cEl);
    const mp = set('mMed', median(S.ms).toFixed(1) + ' ms'); if (mp && hudEls.ready) flash(hudEls.mMed);
    const fp = set('mFloor', S.floor.toFixed(2)); if (fp && hudEls.ready) flash(hudEls.mFloor);
    set('secExec', J.fmt(S.dest.execute)); set('secRev', J.fmt(S.dest.review)); set('secSkip', J.fmt(S.dest.skip)); // desk header: live gate tally (this session)
    if (hudEls.fl !== S.floor) { hudEls.fl = S.floor; document.querySelectorAll('.foot-fl').forEach((el) => (el.textContent = 'floor ' + S.floor.toFixed(2))); }
    const k = hudEls.killBtn || (hudEls.killBtn = document.getElementById('killBtn'));
    if (k) { k.setAttribute('aria-pressed', String(S.killed)); const t = hudEls.killTxt || (hudEls.killTxt = document.getElementById('killTxt')); if (t && t.textContent !== (S.killed ? 'HALTED' : 'ARMED')) t.textContent = S.killed ? 'HALTED' : 'ARMED'; }
  }
  J.hud = hud;

  /* ---------- keyboard shortcuts: J.shortcut(key, fn, label) + '?' help dialog ---------- */
  const keys = [];
  /** register a single-key shortcut (case-insensitive, no modifiers). `label` (optional) lists it in the '?' dialog. Returns an unregister fn. */
  J.shortcut = (key, fn, label) => { const o = { key: String(key).toLowerCase(), fn, label }; keys.push(o); return () => { const i = keys.indexOf(o); if (i >= 0) keys.splice(i, 1); }; };

  J.toTop = () => { window.scrollTo({ top: 0, behavior: J.reduce ? 'auto' : 'smooth' }); const l = document.querySelector('.logo'); if (l) l.focus({ preventScroll: true }); };
  let dlg = null, dlgBack = null, dlgFrom = null;
  function helpOpen() { return !!(dlg && dlg.classList.contains('on')); }

    const rows = [['?', 'this help'], ['1 – 5', 'jump to decides · builds · hour · desk · lab']].concat(keys.filter((k) => k.label).map((k) => [k.key === ' ' ? 'space' : k.key, k.label])).concat([['esc', 'close']]);
    dlg.innerHTML = '<div class="kb-h"><div><span class="kb-eb">keyboard</span><h2 id="kbTitle">shortcuts</h2></div><button type="button" class="kb-x" aria-label="Close shortcuts">esc</button></div><dl class="kb-l"></dl>'
      + '<p class="kb-n">simulation console. shortcuts never place orders; the kill switch only reroutes simulated tickets to review.</p>';
    const dl = dlg.querySelector('dl');

    dlg.querySelector('.kb-x').addEventListener('click', helpClose);
    document.body.append(dlgBack, dlg);
  }
  J.help = (on) => {
    if (on === false) return helpClose();
    if (helpOpen()) return helpClose();
    if (!dlg) helpBuild();
    dlgFrom = document.activeElement; dlg.classList.add('on'); dlgBack.classList.add('on'); document.body.classList.add('kb-open');
    dlg.querySelector('.kb-x').focus({ preventScroll: true });
  };
  J.shortcut('k', () => J.setKilled(!S.killed), 'kill switch (arm / halt)');
  J.shortcut('f', () => { J.fire(); if (J.pulse) J.pulse(0.45); }, 'fire a simulated decision');
  J.shortcut('t', () => J.toTop(), 'back to top');
  SECS.forEach((id, i) => J.shortcut(String(i + 1), () => goto(id)));
  J.shortcut('?', () => J.help());
  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    if (helpOpen()) {
      if (e.key === 'Escape') { e.preventDefault(); helpClose(); } else if (e.key === 'Tab') { e.preventDefault(); dlg.querySelector('.kb-x').focus(); } else if (e.key === '?') { e.preventDefault(); helpClose(); }
      return;
    }

  });

  /* ---------- HUD tooltips (one fixed element: .mets scrolls, so a CSS child would clip) + scroll progress ---------- */
  function hudExtras() {
    const hudEl = document.getElementById('hud'); if (!hudEl) return;
    const tip = document.createElement('div'); tip.className = 'hud-tip'; tip.setAttribute('aria-hidden', 'true'); document.body.appendChild(tip);
    let cur = null, tm = 0, touch = false;
    const hide = () => { clearTimeout(tm); cur = null; tip.classList.remove('on'); };
    const show = (m) => {
      if (m === cur) return; cur = m; clearTimeout(tm);
      tip.textContent = m.getAttribute('data-tip'); tip.classList.add('on');
      const r = m.getBoundingClientRect(), w = tip.offsetWidth;
      tip.style.left = Math.round(J.clamp(r.left, 8, innerWidth - w - 8)) + 'px'; tip.style.top = Math.round(r.bottom + 10) + 'px';

    hudEl.addEventListener('mouseover', (e) => { const m = e.target.closest && e.target.closest('.m[data-tip]'); if (m) show(m); });
    hudEl.addEventListener('mouseout', (e) => { const m = e.target.closest && e.target.closest('.m[data-tip]'); if (m && !m.contains(e.relatedTarget)) hide(); });
    hudEl.addEventListener('focusin', (e) => { const m = e.target.closest && e.target.closest('.m[data-tip]'); if (m && e.target.matches(':focus-visible')) show(m); });
    hudEl.addEventListener('focusout', hide);
    window.addEventListener('scroll', () => { if (cur) hide(); }, { passive: true });
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') hide(); });
    // section scroll offset follows the real sticky HUD height; page scroll progress hairline (transform only, one write per frame)
    const prog = hudEl.querySelector('.hud-prog'); let pr = 0;
    const root = document.documentElement;
    const upd = () => { pr = 0; if (prog) prog.style.transform = 'scaleX(' + J.clamp(scrollY / Math.max(1, root.scrollHeight - innerHeight), 0, 1).toFixed(4) + ')'; };
    window.addEventListener('scroll', () => { if (!pr) pr = requestAnimationFrame(upd); }, { passive: true }); upd();
    new ResizeObserver(() => root.style.setProperty('--hud-h', hudEl.offsetHeight + 'px')).observe(hudEl);
    const hb = document.getElementById('helpBtn'); if (hb) hb.addEventListener('click', () => J.help());
    document.querySelectorAll('[data-act="help"]').forEach((b) => b.addEventListener('click', () => J.help()));
    document.querySelectorAll('[data-act="top"]').forEach((b) => b.addEventListener('click', () => J.toTop()));
  }

  /* ---------- module registry: JEV.mod(name, init) — each module is a closure, no globals ---------- */
  const mods = [];
  J.mod = (name, init) => mods.push({ name, init });
  J.boot = () => {
    const kb = document.getElementById('killBtn');
    if (kb) kb.addEventListener('click', () => J.setKilled(!S.killed));
    hud(); hudEls.ready = true; hudExtras(); pauseOffscreen();
    try { headings(); tintInit(); } catch (e) { console.error('[core:spectacle]', e); }
    for (const m of mods) {
      const t0 = performance.now();
      try { m.init(); } catch (e) { console.error('[module:' + m.name + ']', e); }
      J.bootLog = (J.bootLog || []); J.bootLog.push(m.name + ' ' + (performance.now() - t0).toFixed(1) + 'ms');
    }
    J.start();
    document.documentElement.classList.add('ready');
  };
})();

<script>
/* desk/drift-chart — drift vs noise: 140 random walks + live end-value histogram (prefix dkb-). Everything is SIMULATED.
 * Reuse: copy this folder + engine.js + core.js + base.css; call JEV.boot() (the shared main.js does it).
 * JEV.* API relied on:
 *   JEV.mod, JEV.$, JEV.S (killed), JEV.clamp/gauss/TAU/rnd, JEV.fit, JEV.watch, JEV.task, JEV.onView, JEV.animate, JEV.reduce, JEV.DPR, JEV.tier
 *   JEV.bus: 'pulse' (optional), 'decision' (heartbeat only); halts on body.killed / JEV.S.killed
 * Swap in real data: replace gen() (PX[i*S1+k] = equity of path i at step k, in bps) with your own paths.
 * Everything else in the file is local to the closure. Missing optional DOM / bus events never throw. */
JEV.mod('desk-drift-chart', () => {
    const J = JEV, $ = J.$, C = J.C, S = J.S, clamp = J.clamp, fmt = J.fmt, gauss = J.gauss, TAU = J.TAU;
  const drc = $('#dkb-drift');
  if (!drc) return;
  const MONO = "'JetBrains Mono', ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace";
  const setT = (el, s) => { if (el && el.textContent !== s) el.textContent = s; };
  /** odometer: per-digit cells; a changed digit rolls in from below (up) or above (down) while the old one leaves — transform/opacity only, no clipping so the glow survives */
  const odo = (el) => {
    let cells = [], cur = '';
    return (s) => {
      if (s === cur) return;
      const up = parseFloat(s) >= parseFloat(cur || s);
      if (s.length !== cur.length) {
        el.textContent = ''; cells = [];
        for (let i = 0; i < s.length; i++) { const c = document.createElement('span'), t = document.createElement('i'); c.className = 'dkb-dg'; c.setAttribute('aria-hidden', 'true'); t.textContent = s[i]; c.appendChild(t); el.appendChild(c); cells.push(c); }
      } else {
        for (let i = 0; i < s.length; i++) {
          if (s[i] === cur[i]) continue;
          const c = cells[i], t = c.firstChild, old = t.textContent; t.textContent = s[i];
          if (J.reduce || s[i] === '.' || old === '.') continue;
          const gh = document.createElement('i'); gh.className = 'dkb-gh'; gh.textContent = old; c.appendChild(gh);

        g.beginPath(); g.moveTo(px0, yPx(PX[base])); for (let k = 1; k <= o; k++) g.lineTo(px0 + k * dx, yPx(PX[base + k]));
        g.lineWidth = 4; g.strokeStyle = 'rgba(' + rgb + ',' + (0.12 * a).toFixed(3) + ')'; g.stroke();
        g.lineWidth = 1.8; g.strokeStyle = 'rgba(' + rgb + ',' + (0.95 * a).toFixed(3) + ')'; g.stroke();
        g.lineWidth = 0.7; g.strokeStyle = 'rgba(255,255,255,' + (0.55 * a).toFixed(3) + ')'; g.stroke();
        // comet: a faint head that runs the path from trade 1 to the frontier, with a fading tail
        if (!J.reduce) {
          const hp = ((t * 0.5) % 1) * o, h0 = hp | 0, tl = 22; g.lineWidth = 2;
          for (let k = Math.max(1, h0 - tl); k <= h0 && k <= o; k++) { const f = (k - (h0 - tl)) / tl; g.strokeStyle = 'rgba(255,255,255,' + (0.5 * f * f * a).toFixed(3) + ')'; g.beginPath(); g.moveTo(px0 + (k - 1) * dx, yPx(PX[base + k - 1])); g.lineTo(px0 + k * dx, yPx(PX[base + k])); g.stroke(); }
          g.globalAlpha = 0.8 * a; g.drawImage(spr, px0 + h0 * dx - 9, yPx(PX[base + h0]) - 9, 18, 18); g.globalAlpha = 1;
        }
        g.globalCompositeOperation = 'source-over';
        // marker + vertical hairline at the hovered step
        const mx = px0 + kk * dx, my2 = yPx(PX[base + kk]), val = PX[base + kk];
        g.globalAlpha = a; g.fillStyle = 'rgba(255,255,255,.14)'; g.fillRect(Math.round(mx), padT, 1, ph);
        g.beginPath(); g.arc(mx, my2, 3.4, 0, TAU); g.fillStyle = '#fff'; g.fill(); g.lineWidth = 1.5; g.strokeStyle = 'rgba(' + rgb + ',1)'; g.stroke();
        if (t - PRD.pt > 0.07) {
          PRD.pt = t; const txt = '#' + String(i + 1).padStart(3, '0') + ' · ' + sgn(val, 0) + 'bp @ ' + kk + ' · ends ' + sgn(PX[base + o], 0);
          if (txt !== PRD.pk) { PRD.pk = txt; PRD.pw = txt.length * 5.6 + 12; bake(PRD.pc, txt, PRD.pw, 15, 'rgba(10,6,16,.92)', 'rgba(' + rgb + ',.85)', '#fff', F_TAG); }
        }
        g.drawImage(PRD.pc, clamp(mx + 10 + PRD.pw > px1 + 4 ? mx - 10 - PRD.pw : mx + 10, px0, px1 + 4 - PRD.pw), clamp(my2 - 24 < padT + 2 ? my2 + 10 : my2 - 24, padT + 2, padT + ph - 17), PRD.pw, 15);
        g.globalAlpha = 1;
      }
      if (killed) {
        g.fillStyle = 'rgba(255,60,80,.07)'; g.fillRect(px0, padT, hx1 - px0, ph);
        g.drawImage(haltCv, px0 + pw / 2 - 84, padT + ph / 2 - 11, 168, 22);
      }
    };

    const frame = (t, dt) => {
      if (!ok) return;
      const killed = S.killed;
      if (J.reduce) { if (step < T) { paint(CG[cur], step, T); step = T; finish(); phase = 1; xf = XF; fade(); } }
      else if (!killed) {
        if (phase === 0) {
          acc += dt * RATE; const n = Math.min(Math.floor(acc), T - step);
          if (n > 0) { acc -= n; paint(CG[cur], step, step + n); step += n; }
          if (step >= T) { phase = 1; phT = 0; finish(); }
        } else { phT += dt; if (phT > HOLD) { cur ^= 1; newRun(PRE); phase = 0; xf = 0; fade(); } }
        if (xf < XF) { xf = Math.min(XF, xf + dt); fade(); }
      }
      overlay(t, dt, killed);

      // ---- DOM at 4 Hz ----
      domT += dt;
      if (domT >= 0.25 || J.reduce) {
        domT = 0;
        oP(((wins() / N) * 100).toFixed(1)); setT(eTr, String(step));
        const ms = sgn(mv, 0); if (ms !== meanStr) { meanStr = ms; bakeMean(); }
        setT(ePool, ((poolW / poolN) * 100).toFixed(1) + '%'); setT(eRuns, runs + (runs === 1 ? ' run' : ' runs'));
      }
    };
    J.watch(wrap, lay); afterReveal(drc, lay);
    J.task(drc, frame);
  };
  /* heartbeat: the card breathes a glow on every decision */
  /* heartbeat: the three cards breathe a synchronized glow on every decision / JEV.pulse (bus 'pulse' when core emits it) */
  let lastBeat = -1e9;
  const beat = (str) => {
    if (!FX_ON() || J.hidden()) return;
    const n = performance.now(); if (n - lastBeat < 260) return; lastBeat = n;
    const a = 0.12 + 0.3 * clamp(str, 0, 1), k = S.killed ? '255,77,94' : '255,46,110';
    [drc].forEach((c) => J.animate(c, [{ boxShadow: '0 0 0 0 rgba(' + k + ',0), inset 0 0 0 rgba(' + k + ',0)' }, { boxShadow: '0 0 34px -6px rgba(' + k + ',' + a.toFixed(2) + '), inset 0 0 38px rgba(' + k + ',' + (a * 0.35).toFixed(2) + ')', offset: 0.2 }, { boxShadow: '0 0 12px -6px rgba(' + k + ',' + (a * 0.3).toFixed(2) + '), inset 0 0 14px rgba(' + k + ',' + (a * 0.1).toFixed(2) + ')', offset: 0.42 }, { boxShadow: '0 0 0 0 rgba(' + k + ',0), inset 0 0 0 rgba(' + k + ',0)' }], { duration: 1100, easing: 'ease-out' }));
  };
  J.bus.on('decision', (d) => beat(d && d.dest === 'execute' ? 0.8 : 0.4));
  J.bus.on('pulse', (s) => beat(+s || 0.5));
  initDrift();
});

</script>

  else window.JEV.boot();
