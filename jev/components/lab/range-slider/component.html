<div class="lab" id="lab-rs">
  <section class="card lab-st" data-c="pink" aria-labelledby="lab-rs-t">
    <i class="lab-edge" aria-hidden="true"></i>
    <div class="lab-ph"><span class="lab-tag" id="lab-rs-t">slider</span><span class="lab-ps">drag · arrows · shift = x10 · double-click resets</span></div>
    <div class="lab-sub"><span>variants</span><i></i><em><u class="lab-dzk"></u>red band trips risk</em></div>
    <div class="lab-sliders">
      <div class="lab-row" data-c="pink" data-label="edge_bps" data-min="-40" data-max="40" data-step="0.5" data-value="9" data-dec="1" data-sign data-bi data-mark="0"></div>
      <div class="lab-row" data-c="yellow" data-label="spread_bps" data-min="0.2" data-max="20" data-step="0.1" data-value="1.8" data-dec="1" data-dz="8,20"></div>
      <div class="lab-row" data-c="cyan" data-label="latency_ms" data-min="5" data-max="600" data-step="1" data-value="42" data-dec="0" data-unit="ms" data-dz="300,600"></div>
      <div class="lab-row" data-c="green" data-label="daily_pnl" data-min="-2500" data-max="1500" data-step="10" data-value="320" data-usd data-bi data-mark="0" data-dz="-2500,-1600"></div>
      <div class="lab-row" data-c="violet" data-label="net edge (live)" data-min="-40" data-max="40" data-step="0.5" data-value="0" data-dec="1" data-sign data-bi data-mark="0" data-follow="net"></div>
    </div>
    <p class="lab-why" id="lab-rs-log" aria-live="polite">move a slider &middot; the last value is emitted as <b>lab-slider</b></p>
  </section>
</div>
