<div class="lab" id="lab">
        <aside class="card lab-ctl" id="lab-ctl" data-c="pink" aria-labelledby="lab-ctl-t">
          <i class="lab-edge" aria-hidden="true"></i>
          <div class="lab-ph"><span class="lab-tag" id="lab-ctl-t">state</span><span class="lab-ps">nine inputs &middot; one simulated market</span><span class="lab-bdg"><i class="lamp pink"></i>sandbox</span></div>

          <div class="lab-sub"><span>scenario</span><i></i></div>
          <div class="lab-presets" id="lab-presets" role="group" aria-label="scenario presets">
            <button class="lab-sc" type="button" aria-pressed="false" data-p="trend"><svg class="lab-sc-i" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2 11l3.5-4 2.5 2.5L14 4M10.5 4H14v3.5"/></svg><span>trend</span></button>
            <button class="lab-sc" type="button" aria-pressed="false" data-p="mean-revert"><svg class="lab-sc-i" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M1.5 8c1.6-5 3-5 4.5 0s3 5 4.5 0 2-3.5 4-1.5"/></svg><span>mean-revert</span></button>
            <button class="lab-sc" type="button" aria-pressed="false" data-p="wide book"><svg class="lab-sc-i" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 3v10M5 5.5L2 8l3 2.5M11 5.5L14 8l-3 2.5"/></svg><span>wide book</span></button>
            <button class="lab-sc" type="button" aria-pressed="false" data-p="stale feed"><svg class="lab-sc-i" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="5.5"/><path d="M8 4.8V8l2.2 1.4"/></svg><span>stale feed</span></button>
            <button class="lab-sc" type="button" aria-pressed="false" data-p="reversal"><svg class="lab-sc-i" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M4 13V6.5a3 3 0 0 1 6 0V13M7.5 10.5L10 13l2.5-2.5" transform="translate(0 -1)"/></svg><span>reversal</span></button>
            <button class="lab-sc" type="button" aria-pressed="false" data-p="stress"><svg class="lab-sc-i" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M9 1.8L3.5 9H8l-1 5.2L12.5 7H8z"/></svg><span>stress</span></button>
            <button class="lab-sc lab-sc-r" type="button" aria-pressed="false" data-p="random"><svg class="lab-sc-i" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><rect x="2.5" y="2.5" width="11" height="11" rx="2.5"/><circle cx="5.7" cy="5.7" r=".9" fill="currentColor" stroke="none"/><circle cx="10.3" cy="10.3" r=".9" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r=".9" fill="currentColor" stroke="none"/></svg><span>random</span><kbd class="lab-kbd" aria-hidden="true">R</kbd></button>
          </div>

          <div class="lab-sub"><span>inputs</span><i></i><em><u class="lab-dzk"></u>red band trips risk_ok</em></div>
          <div class="lab-sliders" id="lab-sliders"></div>

          <div class="lab-lower">
            <div class="lab-lw">
              <div class="lab-sub"><span>decide</span><i></i></div>
              <div class="lab-act">
                <div class="lab-magw" id="lab-magw">
                  <button class="lab-go" id="lab-go" type="button" aria-describedby="lab-go-h">
                    <span class="lab-go-t">decide</span><kbd class="lab-kbd" aria-hidden="true">&crarr;</kbd>
                    <svg class="lab-go-i" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3 2.5v11l10-5.5z" fill="currentColor"/></svg>
                  </button>
                </div>
                <button class="lab-sw lab-auto on" id="lab-auto" type="button" role="switch" aria-checked="true" data-c="pink">
                  <i class="tg"></i><span class="lab-sw-t"><b>auto</b><small id="lab-go-h">re-decide on every input</small></span>
                </button>
              </div>
            </div>

            <div class="lab-lw">
              <div class="lab-sub"><span>hard rules</span><i></i><em>held by code, not the model</em></div>
              <div class="lab-rules">
                <div class="lab-floorrow" id="lab-floorrow"></div>
                <button class="lab-sw lab-kill" id="lab-kill" type="button" role="switch" aria-checked="false" data-c="red">
                  <i class="tg"></i><span class="lab-sw-t"><b>kill switch</b><small id="lab-kill-s">armed &middot; orders flow</small></span>
                </button>
                <div class="lab-caps"><span>daily loss cap <b>$2,000</b></span><span>max position <b>4%</b></span></div>
              </div>
            </div>
          </div>

          <div class="lab-sub"><span>state out</span><i></i><em id="lab-out-s">bus &middot; lab-state</em></div>
          <figure class="lab-jsw lab-out">
            <figcaption><i></i><i></i><i></i><span>state.json</span></figcaption>
            <pre class="lab-js" id="lab-js" aria-label="live json readout of the emitted state"></pre>
          </figure>
        </aside>
</div>
