<div class="lab" id="lab">
        <section class="card lab-st lab-s3" id="lab-s3" data-c="orange" aria-labelledby="lab-s3-t">
          <header class="lab-sh"><h3 id="lab-s3-t">confidence gate</h3><span class="lab-sd hide-s">below the floor goes to a human</span><span class="lab-sb" id="lab-verdict">PASS</span></header>
          <div class="lab-gate">
            <div class="lab-gt" id="lab-gt">
              <i class="lab-gt-lo"></i><i class="lab-gt-hi"></i><i class="lab-gt-tail" id="lab-gt-tail"></i><i class="lab-gt-hz"></i>
              <i class="lab-gt-k" style="--x:.25"></i><i class="lab-gt-k" style="--x:.5"></i><i class="lab-gt-k" style="--x:.75"></i>
              <div class="lab-cf" id="lab-cf"><i class="lab-cf-o"></i><b id="lab-cf-v">0.93</b></div>
              <button class="lab-fl" id="lab-fl" type="button" role="slider" aria-label="confidence floor, drag or use arrow keys" aria-valuemin="0.5" aria-valuemax="0.99" aria-valuenow="0.85" aria-valuetext="floor 0.85"><span class="lab-fl-t">floor <b id="lab-fl-v">0.85</b></span></button>
            </div>
            <div class="lab-gx" aria-hidden="true"><span style="--x:0">0</span><span style="--x:.25">.25</span><span style="--x:.5">.5</span><span style="--x:.75">.75</span><span style="--x:1">1</span></div>
            <p class="lab-why" id="lab-why">reason <b>ok</b> &rarr; execute</p>
          </div>
        </section>
</div>
