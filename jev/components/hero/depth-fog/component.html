<section class="hdf-stage" id="hdfStage" aria-label="Depth fog over a layered mesh (simulation)">
  <div class="hdf-net" id="hdfNet">
    <canvas id="hdfStatic" aria-hidden="true"></canvas>
    <canvas id="hdfLive" role="img" aria-label="Layered mesh from state to code acts. A wave travels left to right on every decision; the layers away from the wave sink into the dark. Click or tap to fire a simulated decision."></canvas>
    <div class="hdf-focus" id="hdfFocus" aria-live="off">idle: focus rests on the jev tower</div>
  </div>
  <div class="hdf-bar">
    <button class="hbtn" id="hdfFog" type="button" aria-pressed="true">depth fog: on</button>
    <button class="hbtn" id="hdfFire" type="button">fire a decision</button>
  </div>
</section>
