<section class="hbp-stage" id="hbpStage" aria-label="Bloom pass over animated beams (simulation)">
  <div class="hbp-net" id="hbpNet">
    <canvas id="hbpStatic" aria-hidden="true"></canvas>
    <canvas id="hbpLive" role="img" aria-label="Animated beams across a layered mesh with an additive bloom composite. Click or tap to fire a simulated decision."></canvas>
  </div>
  <div class="hbp-bar">
    <button class="hbtn" id="hbpToggle" type="button" aria-pressed="true">bloom: on</button>
    <button class="hbtn" id="hbpFire" type="button">fire a decision</button>
    <span class="hbp-th" aria-hidden="true"><canvas id="hbpA" width="120" height="68"></canvas><i>1/3 copy</i></span>
    <span class="hbp-th" aria-hidden="true"><canvas id="hbpB" width="120" height="68"></canvas><i>1/9 copy, added back</i></span>
  </div>
</section>
