<section class="hst-stage" id="hstStage" aria-label="Signal trace of the latest decision (simulation)">
  <div class="hst-net" id="hstNet">
    <canvas id="hstStatic" aria-hidden="true"></canvas>
    <canvas id="hstLive" role="img" aria-label="Layered mesh. After every decision a glowing line draws on along the real edges from the strongest state field through encode, the jev layers, the three questions and the chosen answers to the code act, then fades over two seconds. Click or tap to fire a simulated decision."></canvas>
  </div>
  <div class="hst-path" id="hstPath" aria-live="off"><span class="hst-k">latest trace</span><span id="hstTxt">fire a decision to trace it</span></div>
  <div class="hst-bar"><button class="hbtn" id="hstFire" type="button">fire a decision</button></div>
</section>
