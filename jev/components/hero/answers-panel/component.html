<section id="aps" class="aps" aria-label="Typed questions, answers and code acts (simulation)">
  <div class="aps-stage" id="apsStage">
    <div class="aps-bg" aria-hidden="true"><i class="aps-aura"></i><i class="aps-grid"></i></div>
    <canvas id="aps-static" aria-hidden="true"></canvas>
    <canvas id="aps-live" role="img" aria-label="Live diagram: each decision enters three typed questions, fills eleven answer probabilities against a 0.85 confidence floor, and lands on one of three code acts: execute, review or skip. Click or tap to fire a simulated decision."></canvas>
    <div class="aps-legend" aria-hidden="true">
      <span><i class="aps-dot aps-dot-ex"></i>execute</span><span><i class="aps-dot aps-dot-rv"></i>review</span><span><i class="aps-dot aps-dot-sk"></i>skip</span><span class="aps-sim">simulated &middot; no orders sent &middot; tap to fire</span>
    </div>
  </div>
</section>
