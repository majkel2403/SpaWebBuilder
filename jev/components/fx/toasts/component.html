<div id="fx-toasts" role="status" aria-live="polite"></div>
<section class="fxd-card" aria-label="toast demo">
  <div class="fxd-eb">fx / toasts</div>
  <h1 class="fxd-h">Toasts <em>that keep up</em></h1>
  <p class="fxd-p">JEV.toast(message, kind) drops a glass pill at the bottom centre. It lives 3 s, hover holds it, tap / swipe / Esc dismisses it, and at most two stack. The kill switch and the floor also raise toasts through the bus.</p>
  <div class="fxd-row">
    <button class="fxd-btn" id="fxdOk">ok</button>
    <button class="fxd-btn" id="fxdKillT">kill</button>
    <button class="fxd-btn" id="fxdInfo">info</button>
    <button class="fxd-btn" id="fxdBus">throw kill switch (bus)</button>
    <button class="fxd-btn" id="fxdFloor">raise floor (bus)</button>
  </div>
</section>
