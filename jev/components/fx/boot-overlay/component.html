<template id="fx-boot-tpl">
<div id="fx-boot" aria-hidden="true">
  <i class="fx-bh t"></i><i class="fx-bh b"></i>
  <div class="fx-bx">
    <div class="fx-bhead"><b>J</b><span>jev desk</span><em>boot // simulation</em></div>
    <div class="fx-blog" id="fx-blog"></div>
    <div class="fx-bbar"><i id="fx-bfill"></i></div>
    <div class="fx-bmeta"><span id="fx-bpct">00% - 0/5</span><span>click or press any key to skip</span></div>
  </div>
  <i class="fx-bline"></i>
</div>
</template>
<section class="fxd-card" aria-label="boot overlay demo">
  <div class="fxd-eb">fx / boot overlay</div>
  <h1 class="fxd-h">Simulation <em>online</em></h1>
  <p class="fxd-p">The page that is revealed when the boot shutter opens. The overlay runs about one second, types five checks, ticks the bar on each one, and can be skipped with a click or any key.</p>
  <div class="fxd-row"><button class="fxd-btn" id="fxdReplay">replay boot</button></div>
</section>
