<section class="fxd-stage fxd-pad">
  <div class="fxd-eb">fx / light-sweep</div>
  <h2 class="h2 fx-hs" data-sweep>Ten builds. <em>One</em> decision layer.</h2>
  <p class="fxd-p">Add class <code>fx-hs</code> to a heading and call <code>JEV.sweep(el)</code> (or append the <code>.fx-hsw</code> band yourself). It plays once when the element scrolls into view; hover replays it.</p>
  <div class="fxd-grid">
    <div class="fxd-tile fx-hs" data-sweep><b>Hover me</b><span>replays on pointer enter</span></div>
    <div class="fxd-tile fx-hs" data-sweep data-loop><b>Looping</b><span>data-loop, every 3.5 s</span></div>
  </div>
  <div class="fxd-row"><button class="fxd-btn" type="button" id="fxdReplay">replay all</button></div>
</section>
