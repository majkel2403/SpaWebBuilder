<section class="fxd-stage fxd-pad" id="fxdSpotBox" style="min-height:380px">
  <div class="fx-spotwrap" id="fx-spotwrap" aria-hidden="true"><i id="fx-spot"></i></div>
  <div class="fxd-eb">fx / cursor-spotlight</div>
  <h1 class="fxd-h">Light that <em>follows you</em></h1>
  <p class="fxd-p">Move the pointer over this box (fine pointers only). The disc eases toward the pointer with exponential smoothing and fades out when you leave. Touch devices show nothing.</p>
  <div class="fxd-row"><button class="fxd-btn" type="button" id="fxdKill" aria-pressed="false">kill switch</button></div>
  <div class="fxd-grid"><div class="fxd-tile"><b>0.85</b><span>confidence floor</span></div><div class="fxd-tile"><b>4%</b><span>max position</span></div></div>
</section>
