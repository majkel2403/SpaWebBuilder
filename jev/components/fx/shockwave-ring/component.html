<section class="fxd-stage fxd-pad" id="fxdWave" style="min-height:360px">
  <div id="fx-shock" aria-hidden="true"></div>
  <div class="fxd-eb">fx / shockwave-ring</div>
  <h1 class="fxd-h">Shockwave <em>from a point</em></h1>
  <p class="fxd-p">Click anywhere in this box to fire a ring from the pointer. <code>JEV.shockwave(x, y, {green, host})</code> is the helper; the kill switch fires it too (red on halt, green on arm).</p>
  <div class="fxd-row"><button class="fxd-btn" type="button" id="fxdKill" aria-pressed="false">kill switch</button><button class="fxd-btn" type="button" id="fxdGreen">green ring</button></div>
</section>
