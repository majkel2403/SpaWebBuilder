<section class="fxd-stage fxd-pad">
  <div class="fxd-eb">fx / grain-overlay</div>
  <h1 class="fxd-h">Film grain <em>on anything</em></h1>
  <p class="fxd-p">Put <code>&lt;div class="fx-grainhost"&gt;&lt;i class="fx-grain"&gt;&lt;/i&gt;&lt;/div&gt;</code> as the last child of any <code>position:relative</code> box. Strength is the <code>--grain</code> custom property (default .05); the tile hops in steps, transform only.</p>
  <div class="fxd-grid">
    <div class="fxd-tile" style="--grain:0"><div class="fx-grainhost"><i class="fx-grain"></i></div><b>0</b><span>off</span></div>
    <div class="fxd-tile" style="--grain:.05"><div class="fx-grainhost"><i class="fx-grain"></i></div><b>.05</b><span>page default</span></div>
    <div class="fxd-tile" style="--grain:.14"><div class="fx-grainhost"><i class="fx-grain"></i></div><b>.14</b><span>heavy</span></div>
    <div class="fxd-tile" style="--grain:.28"><div class="fx-grainhost"><i class="fx-grain"></i></div><b>.28</b><span>vhs</span></div>
  </div>
</section>
