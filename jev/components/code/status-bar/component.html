<div class="cx-sb" id="cx-sb">
  <div class="code-win">
    <p class="cx-sb-body">editor body &middot; the status bar below counts every simulated decision by where it landed</p>
    <div class="code-status" role="group" aria-label="simulated queue counters">
      <span class="code-st-a"><i class="lamp"></i><span class="code-st-t">jev-starter &middot; python</span></span>
      <span class="code-st-b"><span class="hide-s">floor <b class="code-fl">0.85</b> &middot; </span>kill <b class="code-kl">armed</b></span>
      <span class="code-st-q"><span class="code-st-l">queue/</span>
        <span class="code-q code-q-x"><i></i>execute <b class="code-n-x">0</b></span>
        <span class="code-q code-q-r"><i></i>review <b class="code-n-r">0</b></span>
        <span class="code-q code-q-s"><i></i>skip <b class="code-n-s">0</b></span>
        <span class="code-qbar" aria-hidden="true"><i class="x"></i><i class="r"></i><i class="s"></i></span>
      </span>
    </div>
  </div>
  <p class="cx-sb-hint"><button class="cx-sb-fire" type="button">fire a decision</button> or press <kbd>f</kbd> &middot; <kbd>k</kbd> throws the kill switch</p>
</div>
